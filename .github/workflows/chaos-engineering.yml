name: Chaos Engineering Matrix (Playwright)

on:
  push:
    branches: [ "feat/world-class-optimization" ]
  pull_request:
    branches: [ "main" ]

jobs:
  chaos_tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      matrix:
        condition: [ "perfect_network", "5kbps_gprs", "camera_crash", "corrupted_db_row" ]
    
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-node@v3
      with:
        node-version: 18
        
    - name: Install dependencies
      run: npm ci
      
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      
    - name: Build Application
      run: npm run build
      
    - name: Start Server
      run: npm start &
      
    - name: Inject Chaos Profile (${{ matrix.condition }})
      run: |
        echo "Configuring Playwright to emulate ${{ matrix.condition }} conditions..."
        # In a real workflow, we set environment variables or start a proxy here
        export CHAOS_PROFILE=${{ matrix.condition }}
        
    - name: Run E2E Sync Recovery Tests
      run: npx playwright test tests/sync-recovery.spec.ts
      
    - name: Upload Chaos Artifacts
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: chaos-report-${{ matrix.condition }}
        path: playwright-report/
        retention-days: 7
