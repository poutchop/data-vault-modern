syntax = "proto3";

package dmrv.v1;

message Position {
  double latitude = 1;
  double longitude = 2;
  float altitude = 3;
  int64 timestamp = 4;
}

message FarmPolygon {
  string polygon_uuid = 1;
  string cooperative_id = 2;
  repeated Position boundary_points = 3;
}

message DmrvPayload {
  string payload_id = 1;
  string verifier_did = 2;         // W3C Decentralized Identifier from Milestone 1
  FarmPolygon farm_data = 3;
  bytes image_sha256_hash = 4;     // Cryptographic proof of the onsite image file
  int64 local_commit_timestamp = 5;
}
