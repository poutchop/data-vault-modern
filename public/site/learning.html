<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carbon Clarity Learning</title>
<meta name="description" content="Carbon Clarity's learning platform: daily lessons, videos, knowledge checks, spaced revision and a carbon simulation lab on carbon markets, research methods, stove technology, funding and policy.">
<style>
:root{--bg:#F3F6F2;--card:#fff;--ink:#14261F;--muted:#55675F;--accent:#0F7C72;--accent-ink:#fff;--line:#D9E2DC;--soft:#E6F0EC;--warn:#B4561D}
@media (prefers-color-scheme:dark){:root{--bg:#0E1814;--card:#15231E;--ink:#E5EEE9;--muted:#9FB2A9;--accent:#4FC3B5;--accent-ink:#06201C;--line:#26372F;--soft:#1B2D27;--warn:#F0A36B}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--accent)}button{font:inherit;cursor:pointer}
.top{background:var(--accent);color:var(--accent-ink);padding:14px 16px}.top .w{max-width:1180px;margin:auto;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.brand{font-weight:800;font-size:19px;letter-spacing:.2px}.brand small{display:block;font-weight:500;font-size:13px;opacity:.85}
.prog{min-width:220px;flex:1;max-width:360px}.prog .bar{height:8px;border-radius:99px;background:rgba(255,255,255,.3);overflow:hidden}.prog .bar i{display:block;height:100%;background:var(--accent-ink);width:0;transition:width .3s}
.prog span{font-size:13px;opacity:.9}
.today{background:var(--accent-ink);color:var(--accent);border:0;border-radius:99px;padding:8px 16px;font-weight:700}
.layout{max-width:1180px;margin:auto;display:grid;grid-template-columns:250px 1fr;gap:24px;padding:20px 16px 60px}
aside{position:sticky;top:12px;align-self:start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;max-height:calc(100vh - 24px);overflow:auto}
aside h4{margin:12px 8px 4px;font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}aside h4:first-child{margin-top:4px}
aside a{display:flex;justify-content:space-between;gap:8px;padding:6px 10px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:14.5px}
aside a:hover{background:var(--soft)}aside a.on{background:var(--accent);color:var(--accent-ink)}aside a .ck{color:var(--accent);font-weight:700}aside a.on .ck{color:var(--accent-ink)}
main{min-width:0}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:18px}
.crumb{color:var(--muted);font-size:14px;margin:0 0 4px}h1{margin:0 0 6px;font-size:clamp(24px,4vw,32px);line-height:1.2}h2{font-size:20px;margin:0 0 10px}h3{font-size:17px;margin:18px 0 6px}
.player{position:relative;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
.player img{width:100%;height:100%;object-fit:cover;display:block;opacity:.85}.player button.play{position:absolute;inset:0;border:0;background:transparent;display:flex;align-items:center;justify-content:center}
.player button.play b{width:76px;height:54px;border-radius:14px;background:#E0262B;display:flex;align-items:center;justify-content:center}.player button.play b:after{content:"";border-left:20px solid #fff;border-top:12px solid transparent;border-bottom:12px solid transparent;margin-left:5px}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vmeta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 14px;margin:10px 0 0;font-size:15px}.vmeta strong{flex:1;min-width:200px}
.more{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:14px}
.vt{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:0;text-align:left;color:var(--ink);overflow:hidden}.vt img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}.vt span{display:block;padding:7px 9px;font-size:13.5px;line-height:1.35}.vt.on{outline:3px solid var(--accent)}
.formula{background:var(--soft);border-left:4px solid var(--accent);padding:12px 14px;border-radius:6px;font-weight:600}
.notes label{display:block;font-weight:600;margin:12px 0 4px;font-size:15px}.notes textarea{width:100%;min-height:64px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.btn{border:1px solid var(--accent);background:var(--card);color:var(--accent);border-radius:99px;padding:8px 16px;font-weight:600}.btn.pri{background:var(--accent);color:var(--accent-ink)}
.saved{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:15px}th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}th{background:var(--soft)}
.weekpick{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}.weekpick a{padding:5px 12px;border:1px solid var(--line);border-radius:99px;text-decoration:none;font-size:14px;color:var(--ink)}.weekpick a.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.note-item{border-top:1px solid var(--line);padding:12px 0}.note-item p{margin:4px 0}
.hint{color:var(--muted);font-size:14px}
@media (max-width:820px){.layout{grid-template-columns:1fr;gap:12px}aside{position:static;max-height:none;display:flex;overflow-x:auto;gap:4px;padding:8px}aside h4{display:none}aside a{white-space:nowrap;flex:none}.card{padding:16px}}
:root{--ok:#1F7A47;--ok-soft:#DFF1E6;--bad:#A3332A;--bad-soft:#F7E1DE;--ember:#B4561D;--ember-soft:#F7E6DA}
@media (prefers-color-scheme:dark){:root{--ok:#6BCB93;--ok-soft:#173326;--bad:#EF8A80;--bad-soft:#3A1E1B;--ember:#F0A36B;--ember-soft:#3A271B}}
.sub{color:var(--muted);margin:0 0 4px;max-width:70ch}.eyebrow{margin:0 0 6px;font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--accent)}
.empty{color:var(--muted);font-style:italic}.btn.big{padding:12px 22px;font-size:17px}.btn:disabled{opacity:.6;cursor:default}
.hero{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;background:linear-gradient(135deg,var(--card),var(--soft))}
.hero h1{font-size:clamp(24px,3.6vw,34px);text-wrap:balance}
.heroStats{display:grid;gap:10px}.hs{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 18px;text-align:center;min-width:130px}.hs b{display:block;font-size:30px;font-variant-numeric:tabular-nums;line-height:1.1;color:var(--accent)}.hs span{font-size:13px;color:var(--muted)}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}.dgrid>.card{margin-bottom:18px}
.rings{display:flex;gap:28px;flex-wrap:wrap;justify-content:center;margin-top:8px}.mring{position:relative;width:140px;height:140px}.mring svg{width:100%;height:100%;transform:rotate(-90deg)}
.mring circle{fill:none;stroke-width:10}.mring .trk{stroke:var(--line)}.mring .bar{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .6s}.mring.m .bar{stroke:var(--ember)}
.mring div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.mring b{font-size:28px;font-variant-numeric:tabular-nums}.mring span{font-size:13px;color:var(--muted)}
ul.clean{list-style:none;margin:0;padding:0}ul.clean li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center}ul.clean li:last-child{border-bottom:0}
.pill{font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--soft);color:var(--accent);white-space:nowrap}.pill.warn{background:var(--ember-soft);color:var(--ember)}
.tracks{display:grid;gap:8px}.track{display:grid;grid-template-columns:44px 1fr 2fr 44px;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink)}.track:hover{background:var(--soft)}
.track .tl{font-weight:800;color:var(--accent)}.track .tb{height:10px;border-radius:99px;background:var(--line);overflow:hidden}.track .tb i{display:block;height:100%;background:var(--ember)}.track .tc{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}.badge{border:1px dashed var(--line);border-radius:12px;padding:10px 6px;text-align:center;opacity:.55}.badge b{display:flex;align-items:center;justify-content:center;width:42px;height:42px;margin:0 auto 6px;border-radius:50%;background:var(--line);font-size:14px}.badge span{font-size:12px;line-height:1.25;display:block}
.badge.got{opacity:1;border-style:solid;border-color:var(--accent)}.badge.got b{background:var(--accent);color:var(--accent-ink)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}.tool{border:1px solid var(--line);border-radius:12px;padding:14px;text-decoration:none;color:var(--ink);display:grid;gap:4px}.tool:hover{border-color:var(--accent)}.tool b{color:var(--accent)}.tool span{font-size:14px;color:var(--muted)}
.lmeta{display:flex;flex-wrap:wrap;gap:8px 16px;color:var(--muted);font-size:14px;margin:4px 0 10px}
.steps{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}.steps a{display:flex;align-items:center;gap:6px;padding:5px 12px 5px 6px;border:1px solid var(--line);border-radius:99px;text-decoration:none;color:var(--ink);font-size:14px}
.steps span{width:22px;height:22px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}.steps li.ok a{border-color:var(--ok)}.steps li.ok span{background:var(--ok);color:var(--card)}
.sn{display:inline-flex;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);align-items:center;justify-content:center;font-size:14px;margin-right:10px;vertical-align:2px}
#view>.card[id^="s-"]{scroll-margin-top:12px}
.qz{border:0;margin:0 0 18px;padding:0}.qz legend{font-weight:700;margin-bottom:8px;padding:0}.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 12px;margin:6px 0}
.opt:hover:not(:disabled){border-color:var(--accent)}.opt.right{border-color:var(--ok);background:var(--ok-soft)}.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{margin:6px 0 0;padding:10px 12px;border-radius:10px;font-size:15px}.fb.good{background:var(--ok-soft)}.fb.bad{background:var(--bad-soft)}.score{font-size:16px}
.lnav{justify-content:space-between}
.labgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.labgrid>.card{margin-bottom:18px}
.sl{margin:0 0 12px}.sl label{display:block;font-size:14.5px;font-weight:600;margin-bottom:2px}.slr{display:flex;gap:12px;align-items:center}.slr input{flex:1;accent-color:var(--accent);min-width:0}.slr output{min-width:84px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kpis div{background:var(--soft);border-radius:12px;padding:10px 12px}.kpis b{display:block;font-size:22px;font-variant-numeric:tabular-nums}.kpis span{font-size:13px;color:var(--muted)}
.bars{display:grid;gap:8px}.bars .bar{display:grid;grid-template-columns:120px 1fr 70px;gap:8px;align-items:center;font-size:14px}.bars i{display:block;height:14px;border-radius:6px;background:var(--ember);min-width:2px}.bars em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums}
.warnbox{background:var(--ember-soft);border-radius:10px;padding:10px 14px;font-size:15px;margin:10px 0 0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
:focus-visible{outline:3px solid var(--ember);outline-offset:2px}
@media (max-width:820px){.hero,.dgrid,.labgrid{grid-template-columns:1fr}.heroStats{grid-template-columns:1fr 1fr}.track{grid-template-columns:40px 1fr 44px}.track .tb{grid-column:1/-1;grid-row:2}.kpis{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style></head><body>
<div class="top"><div class="w"><div class="brand">Carbon Clarity Learning<small>Understand. Practise. Apply. Demonstrate.</small></div>
<div class="prog"><span id="progtxt">0 of 20 lessons done</span><div class="bar"><i id="progbar"></i></div></div>
<button class="today" id="todayBtn">Today's lesson</button></div></div>
<div id="toast" hidden role="status"></div><div class="layout"><aside id="nav"></aside><main id="view"></main></div>
<script>
var D={"how": "<p>You learn one thing every day for 45 minutes. After 4 weeks you will\nhave covered every area of Carbon Clarity once. Then start again from\nWeek 1 and go deeper. Each day's section in your calendar matches a\nsection below.<\/p>\n<p><strong>The daily routine (7:00–7:45)<\/strong><\/p>\n<ol type=\"1\">\n<li><strong>Read (20 min).<\/strong> Open the reading for today's day and\nweek. Skim the headings first, then read slowly.<\/li>\n<li><strong>Understand (15 min).<\/strong> Read the key ideas in this\nguide. Answer the two questions in your own words, on paper.<\/li>\n<li><strong>Write your 3 sentences (10 min).<\/strong> Add one row to the\nnotes log at the end of this guide:\n<ul>\n<li>Today I learned…<\/li>\n<li>It matters for Carbon Clarity because…<\/li>\n<li>I could explain it to a fisher, a funder or a professor as…<\/li>\n<\/ul><\/li>\n<\/ol>\n<p><strong>The weekly rhythm<\/strong><\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr class=\"header\">\n<th>Day<\/th>\n<th>Focus<\/th>\n<th>Why it matters<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Monday<\/td>\n<td>Carbon markets &amp; MRV<\/td>\n<td>How smoke saved becomes money for women processors (Phase 3)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Tuesday<\/td>\n<td>Research methods &amp; data<\/td>\n<td>Makes the paper and pilot results credible (Phase 1)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Wednesday<\/td>\n<td>Stove technology &amp; measurement<\/td>\n<td>Lets you judge stoves and sensors (Phase 1–2)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Thursday<\/td>\n<td>Funding &amp; running the venture<\/td>\n<td>Keeps the project alive and growing<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Friday<\/td>\n<td>Carbon markets &amp; policy<\/td>\n<td>Helps you avoid the mistakes others made, and follow Ghana's\nrules<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Saturday<\/td>\n<td>Explain it out loud<\/td>\n<td>Turns reading into confidence<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Sunday<\/td>\n<td>Leadership &amp; reflection (light)<\/td>\n<td>Rest, and choose next week's focus<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>If you miss a day, don't try to catch up twice. Just do the next\nday's session. Consistency matters more than catching up.<\/p>\n", "mon": {"title": "Monday: Carbon markets & MRV", "goal": "<p>Goal: by Week 4 you can explain step by step how wood saved in a\nJames Town smoker becomes a carbon credit and a mobile-money payment.\nMRV means Measurement, Reporting and Verification. It is the evidence\nbuyers pay for.<\/p>\n", "weeks": [{"title": "Week 1: What a carbon credit is", "html": "<p><strong>Read:<\/strong> <a\nhref=\"https://interactive.carbonbrief.org/carbon-offsets-2023/\">Carbon\nBrief Q&amp;A on carbon offsets<\/a>, the sections on what offsets are\nand on cookstoves.<\/p>\n<p><strong>Key ideas<\/strong><\/p>\n<ul>\n<li>One credit = one tonne of CO₂ kept out of the air (tCO₂e).<\/li>\n<li>A stove project earns credits for the wood it saves compared with\nthe old kiln (the <strong>baseline<\/strong>).<\/li>\n<li>Only wood taken from forests faster than they regrow counts. That\nshare is <strong>fNRB<\/strong> (fraction of non-renewable biomass).<\/li>\n<li>The core calculation:<\/li>\n<\/ul>\n<p class=\"formula\">Emission reductions = wood saved (t) × f<sub>NRB<\/sub> × energy per tonne × CO₂ per unit of energy<\/p>\n\n<p><strong>Answer in your own words:<\/strong> Why does fNRB matter so\nmuch? What baseline would we use for Chorkor kilns?<\/p>\n"}, {"title": "Week 2: Gold Standard metered & measured method", "html": "<p><strong>Read:<\/strong> <a\nhref=\"https://globalgoals.goldstandard.org/430_ee_ics_methodology-for-metered-measured-energy-cooking-devices/\">Gold\nStandard Methodology for Metered &amp; Measured Energy Cooking Devices\n(MECD)<\/a>, the summary page and the first pages of the PDF.<\/p>\n<p><strong>Key ideas<\/strong><\/p>\n<ul>\n<li>Credits are based on energy <strong>measured<\/strong> at the device\n(meters, sensors), not on surveys or estimates.<\/li>\n<li>This is why our IoT sensors and the Data Vault matter: they could\nmake Carbon Clarity credits measured, not guessed.<\/li>\n<li>It was written mainly for electric and gas stoves. Ask how far it\ncould fit biomass fish smokers.<\/li>\n<\/ul>\n<p><strong>Answer:<\/strong> What would we need to measure on each smoker\nevery day? Who checks the data?<\/p>\n"}, {"title": "Week 3: Verra VM0050", "html": "<p><strong>Read:<\/strong> <a\nhref=\"https://verra.org/methodologies/vm0050-energy-efficiency-and-fuel-switch-measures-in-cookstoves-v1-0/\">Verra\nVM0050, Energy Efficiency and Fuel Switch Measures in Cookstoves<\/a>,\nthe overview.<\/p>\n<p><strong>Key ideas<\/strong><\/p>\n<ul>\n<li>Verra's newer cookstove method, made stricter after over-crediting\ncriticism.<\/li>\n<li>It uses more conservative fNRB values and requires checking that\nstoves are actually used.<\/li>\n<li>Compare it with Gold Standard: who measures, how often, and how\nconservative.<\/li>\n<\/ul>\n<p><strong>Answer:<\/strong> Name two ways VM0050 is stricter than older\nmethods.<\/p>\n"}, {"title": "Week 4: CLEAR, the newest approach", "html": "<p><strong>Read:<\/strong> <a\nhref=\"https://cleancooking.org/4c/methodology\">CLEAR Methodology, Clean\nCooking Alliance<\/a>. For background, read the <a\nhref=\"https://mecs.org.uk/blog/why-metered-carbon-credits-matter-for-clean-cooking-and-how-the-debate-is-moving-on/\">MECS\nblog on metered credits<\/a>.<\/p>\n<p><strong>Key ideas<\/strong><\/p>\n<ul>\n<li>CLEAR was built to fix the over-crediting problems in older\ncookstove methods.<\/li>\n<li>It relies on measured fuel use and on conservative, up-to-date\ndefaults.<\/li>\n<li>High-integrity credits sell for more. Integrity is a selling point\nfor Carbon Clarity, not a cost.<\/li>\n<\/ul>\n<p><strong>Answer:<\/strong> If a buyer asked \"How do I know your credits\nare real?\", what would you say in 3 sentences?<\/p>\n"}]}, "tue": {"title": "Tuesday: Research methods & data", "goal": "<p>Goal: you can defend every number in the working paper and the pilot,\nand answer \"How do you know?\" from any professor.<\/p>\n", "weeks": [{"title": "Week 1: Designing a good survey", "html": "<p><strong>Read:<\/strong> <a\nhref=\"https://www.pewresearch.org/writing-survey-questions/\">Pew\nResearch Center, Writing Survey Questions<\/a>.<\/p>\n<p><strong>Key ideas<\/strong><\/p>\n<ul>\n<li>Ask one thing per question. Avoid leading words (\"Don't you agree\nthe new stove is better?\").<\/li>\n<li>Pilot the questionnaire with 3–5 processors before the real survey,\nin Ga or Twi.<\/li>\n<li>Record fuel use, cost, smoke exposure and income the same way at\nbaseline and after the pilot. Otherwise you can't compare.<\/li>\n<\/ul>\n<p><strong>Answer:<\/strong> Rewrite one question from our baseline\nsurvey so it is clearer and not leading.<\/p>\n"}, {"title": "Week 2: Thematic analysis of interviews", "html": "<p><strong>Read:<\/strong> <a\nhref=\"https://doi.org/10.1191/1478088706qp063oa\">Braun &amp; Clarke\n(2006), Using thematic analysis in psychology<\/a>, the six phases.<\/p>\n<p><strong>Key ideas<\/strong><\/p>\n<ul>\n<li>Six phases: get familiar, code, find themes, review themes, name\nthem, write up.<\/li>\n<li>A theme is a pattern across many interviews, not one quote you\nlike.<\/li>\n<li>Keep an audit trail (codebook, dates, who coded) so a reviewer can\ntrust the analysis.<\/li>\n<\/ul>\n<p><strong>Answer:<\/strong> What themes do you expect from the James\nTown interviews? How will you check you are not just confirming what you\nexpect?<\/p>\n"}, {"title": "Week 3: Basic statistics in R", "html": "<p><strong>Read:<\/strong> <a target=\"_blank\" rel=\"noopener\" href=\"https://r4ds.hadley.nz/\">R for Data\nScience (2nd ed.)<\/a>, chapters \"Whole game\" and \"Data visualization\".\nInstall R and RStudio first (free).<\/p>\n<p><strong>Key ideas<\/strong><\/p>\n<ul>\n<li>Mean and median describe the middle. Standard deviation describes\nthe spread.<\/li>\n<li>A paired t-test compares the same processors before and after, for\nexample kg of wood per batch on the Chorkor versus the Ahotor.<\/li>\n<li>With a small pilot, report the size of the difference with a\nconfidence interval, not just \"significant\".<\/li>\n<\/ul>\n<p><strong>Answer:<\/strong> If 10 processors used 20% less wood, what\nelse would you need to know before claiming the stove works?<\/p>\n"}, {"title": "Week 4: Writing for peer review", "html": "<p><strong>Read:<\/strong> <a\nhref=\"https://doi.org/10.1371/journal.pcbi.1005619\">Mensh &amp; Kording\n(2017), Ten simple rules for structuring papers<\/a>.<\/p>\n<p><strong>Key ideas<\/strong><\/p>\n<ul>\n<li>One central message per paper. Every section serves it.<\/li>\n<li>Each paragraph starts with its point. Each figure tells one\nstory.<\/li>\n<li>Reviewers look first at the title, abstract and figures. Make them\nstrong.<\/li>\n<\/ul>\n<p><strong>Answer:<\/strong> Write the central message of the working\npaper in one sentence of under 25 words.<\/p>\n"}]}, "wed": {"title": "Wednesday: Stove technology & measurement", "goal": "<p>Goal: you can explain why the Ahotor produces less smoke than the\nChorkor, and how we will prove it with numbers.<\/p>\n", "weeks": [{"title": "Week 1: How fire and smoke work", "html": "<p><strong>Read:<\/strong> <a\nhref=\"https://files.peacecorps.gov/documents/M0091_ANNEX_Cookstoves_TP_ICS_1_Improved-Cookstoves-Handbook.pdf\">Peace\nCorps Improved Cookstoves Handbook<\/a>, the chapter on combustion and\nstove design principles.<\/p>\n<p><strong>Key ideas<\/strong><\/p>\n<ul>\n<li>Clean burning needs three things: enough heat, enough air, and\nenough time for gases to burn (the \"three Ts\": temperature, turbulence,\ntime).<\/li>\n<li>Smoke is unburnt fuel. Less smoke usually means less wood\nwasted.<\/li>\n<li>In fish smoking, <strong>fat dripping onto the fire<\/strong> makes\nthe most harmful smoke (PAHs, cancer-causing compounds). The Ahotor and\nFAO-Thiaroye (FTT) designs separate the fire from the dripping fat.<\/li>\n<\/ul>\n<p><strong>Answer:<\/strong> Draw the Chorkor and the Ahotor from the\nside. Mark where the fire, the fish and the dripping fat are.<\/p>\n"}, {"title": "Week 2: Testing stoves to a standard", "html": "<p><strong>Read:<\/strong> the <a\nhref=\"https://www.iso.org/standard/66519.html\">ISO 19867-1:2018 summary\npage<\/a>, then reread your copy of L.I. 2454.<\/p>\n<p><strong>Key ideas<\/strong><\/p>\n<ul>\n<li>ISO 19867-1 is the international lab test for cookstoves:\nefficiency, emissions, safety and durability, scored in tiers.<\/li>\n<li>Ghana's L.I. 2454 uses it: a safety score of at least 85, efficiency\nof at least 25% for wood and above 35% for charcoal, plus\nlabelling.<\/li>\n<li>Lab results are often better than real use. That's why we also\nmeasure in the field at James Town.<\/li>\n<\/ul>\n<p><strong>Answer:<\/strong> Does L.I. 2454 clearly cover commercial fish\nsmokers? What would you ask the Energy Commission?<\/p>\n"}, {"title": "Week 3: Measuring smoke exposure", "html": "<p><strong>Read:<\/strong> <a\nhref=\"https://doi.org/10.1289/EHP9873\">Weyant et al. (2022),\nEnvironmental Health Perspectives<\/a>, on PM₂.₅ and CO exposure.<\/p>\n<p><strong>Key ideas<\/strong><\/p>\n<ul>\n<li>PM₂.₅ = tiny particles that go deep into the lungs. CO = carbon\nmonoxide, a poisonous gas.<\/li>\n<li>Personal monitors worn by the processor show what she actually\nbreathes, not just what the kiln gives off.<\/li>\n<li>Measure the same women before and after the switch, at the same\ntasks, for 24–48 hours.<\/li>\n<\/ul>\n<p><strong>Answer:<\/strong> Why is a personal monitor better evidence\nthan one sensor on the kiln?<\/p>\n"}, {"title": "Week 4: Sensors, IoT and audit-ready data", "html": "<p><strong>Read:<\/strong> reread the Gold Standard MECD page from Monday\nWeek 2, then open the Data Vault app and list every field it\nrecords.<\/p>\n<p><strong>Key ideas<\/strong><\/p>\n<ul>\n<li>Sensors can record temperature, run time and fuel weight\nautomatically, with a timestamp.<\/li>\n<li>\"Audit-ready\" means: raw data kept, each device has an ID, changes\nlogged, and calibration recorded.<\/li>\n<li>Good data serves three needs at once: the paper (Phase 1), the stove\ndesign (Phase 2) and carbon credits (Phase 3).<\/li>\n<\/ul>\n<p><strong>Answer:<\/strong> What three things must the Data Vault record\nfor a verifier to trust it?<\/p>\n"}]}, "thu": {"title": "Thursday: Funding & running the venture", "goal": "<p>Goal: you can ask for money with confidence and show exactly how it\nwill be used and repaid in impact.<\/p>\n", "weeks": [{"title": "Week 1: Writing a winning grant", "html": "<p><strong>Read:<\/strong> <a\nhref=\"https://doi.org/10.1371/journal.pcbi.0020012\">Bourne &amp; Chalupa\n(2006), Ten simple rules for getting grants<\/a>.<\/p>\n<p><strong>Key ideas<\/strong><\/p>\n<ul>\n<li>Read the funder's goals first. Write to their goals using your\nevidence.<\/li>\n<li>Structure: problem → what you will do → why you → budget →\nmeasurable results.<\/li>\n<li>Ask a colleague to read it as a reviewer before you submit.<\/li>\n<\/ul>\n<p><strong>Answer:<\/strong> Write a 3-sentence problem statement for\nCarbon Clarity that a funder would remember.<\/p>\n"}, {"title": "Week 2: A simple financial model", "html": "<p><strong>Read:<\/strong> browse the free courses at <a\nhref=\"https://acumenacademy.org\">Acumen Academy<\/a> on social enterprise\nfinance and business models.<\/p>\n<p><strong>Key ideas<\/strong><\/p>\n<ul>\n<li>Know three numbers: cost per stove installed, cost per processor per\nyear to run MRV, and expected credits per stove per year.<\/li>\n<li>Revenue per stove = credits × price per credit. Then subtract\nverification costs and the processors' benefit share.<\/li>\n<li>Test a low, middle and high carbon price. Never plan only for the\nbest price.<\/li>\n<\/ul>\n<p><strong>Answer:<\/strong> List the costs of the comparative pilot.\nWhich one is most uncertain?<\/p>\n"}, {"title": "Week 3: Pitching", "html": "<p><strong>Read:<\/strong> <a\nhref=\"https://www.ycombinator.com/library\">Y Combinator Startup\nLibrary<\/a>, search \"how to pitch\".<\/p>\n<p><strong>Key ideas<\/strong><\/p>\n<ul>\n<li>Within 30 seconds say: the problem, who has it, your solution, and\nthe proof so far.<\/li>\n<li>Use one striking number (for example, hours of smoke exposure per\nday).<\/li>\n<li>End with a clear ask: money, a partner or an introduction.<\/li>\n<\/ul>\n<p><strong>Answer:<\/strong> Write and time a 60-second pitch. Record it\non Saturday.<\/p>\n"}, {"title": "Week 4: Partnerships & agreements", "html": "<p><strong>Read:<\/strong> reread any agreement or MoU you have\n(CSIR-FRI, Ashesi, the processors' association), with this checklist in\nmind.<\/p>\n<p><strong>Key ideas<\/strong><\/p>\n<ul>\n<li>Every agreement should say: who does what, who owns the data, who\nowns the carbon credits, and how money is shared.<\/li>\n<li><strong>Benefit-sharing<\/strong> by mobile money must be written\ndown before credits are sold, and agreed with the women themselves.<\/li>\n<li>Get legal advice before signing anything about carbon rights.<\/li>\n<\/ul>\n<p><strong>Answer:<\/strong> Who should own the carbon credits from a\nstove: the processor, Carbon Clarity or the funder? Why?<\/p>\n"}]}, "fri": {"title": "Friday: Carbon markets & policy", "goal": "<p>Goal: you can answer tough critics of cookstove credits, and explain\nhow Ghana's rules shape Carbon Clarity.<\/p>\n", "weeks": [{"title": "Week 1: What makes a credit high quality", "html": "<p><strong>Read:<\/strong> <a\nhref=\"https://icvcm.org/core-carbon-principles/\">ICVCM Core Carbon\nPrinciples<\/a>.<\/p>\n<p><strong>Key ideas<\/strong><\/p>\n<ul>\n<li>The ten principles include: <strong>additionality<\/strong> (it would\nnot happen without carbon money), <strong>permanence<\/strong>,\n<strong>robust quantification<\/strong> (no over-counting), <strong>no\ndouble counting<\/strong>, and <strong>sustainable development\nbenefits<\/strong>.<\/li>\n<li>Credits that pass get a \"CCP\" label and usually sell for a higher\nprice.<\/li>\n<\/ul>\n<p><strong>Answer:<\/strong> Is our stove project additional? Argue both\nsides in two sentences each.<\/p>\n"}, {"title": "Week 2: The over-crediting critique", "html": "<p><strong>Read:<\/strong> <a\nhref=\"https://doi.org/10.1038/s41893-023-01259-6\">Gill-Wiehl, Kammen\n&amp; Haya (2024), Nature Sustainability<\/a>, the abstract and figures.\nA plain summary is on <a\nhref=\"https://phys.org/news/2024-01-global-carbon-overcredit-cookstove-greenhouse.html\">Phys.org<\/a>.<\/p>\n<p><strong>Key ideas<\/strong><\/p>\n<ul>\n<li>The study found cookstove projects claimed about 9 times more\nreductions than they really achieved.<\/li>\n<li>Main causes: fNRB set too high, stove use overestimated, and old\nstoves still used alongside new ones (<strong>stacking<\/strong>).<\/li>\n<li>Our answer: measure actual fuel use, use conservative fNRB, and\ncheck whether the Chorkor is still used.<\/li>\n<\/ul>\n<p><strong>Answer:<\/strong> A professor says \"cookstove credits are a\nscam\". Write your 3-sentence reply.<\/p>\n"}, {"title": "Week 3: Article 6 and Ghana's carbon market", "html": "<p><strong>Read:<\/strong> <a\nhref=\"https://klik.ch/news/news-article/first-itmo-transfer-switzerland-ghana\">KliK\nFoundation, first ITMO transfer Switzerland–Ghana<\/a>, and <a\nhref=\"https://gna.org.gh/2025/03/ghanas-carbon-market-to-generate-over-1-billion-by-2030/\">GNA,\nGhana's carbon market to generate over $1 billion by 2030<\/a>.<\/p>\n<p><strong>Key ideas<\/strong><\/p>\n<ul>\n<li>Article 6 of the Paris Agreement lets countries trade emission\nreductions (ITMOs).<\/li>\n<li>Ghana was among the first to transfer Article 6 credits, from a\ncookstove project, to Switzerland.<\/li>\n<li>Ghana requires carbon projects to be authorised and registered\nnationally, and the government takes a share. Find out what applies to\nus.<\/li>\n<\/ul>\n<p><strong>Answer:<\/strong> What is a \"corresponding adjustment\", and\nwhy does Ghana care about it?<\/p>\n"}, {"title": "Week 4: Ghana's clean cooking policy & L.I. 2454", "html": "<p><strong>Read:<\/strong> your copy of L.I. 2454 and the policy section\n(2.5) of the working paper.<\/p>\n<p><strong>Key ideas<\/strong><\/p>\n<ul>\n<li>L.I. 2454 sets minimum stove performance and labels so that\npoor-quality stoves are kept off the market.<\/li>\n<li>Show that the stove we pilot meets it, or explain clearly why fish\nsmokers need their own standard.<\/li>\n<li>Policy is an opportunity: our data could help the Energy Commission\nset a standard for fish smokers.<\/li>\n<\/ul>\n<p><strong>Answer:<\/strong> In 3 sentences, explain to a policymaker why\nfish smokers need attention in clean cooking policy.<\/p>\n"}]}, "sat": {"title": "Saturday practice: explain it out loud (9:00–10:00)", "html": "<p>This is the session that builds confidence. You don't learn anything\nnew. You prove to yourself that you can explain what you learned.<\/p>\n<ol type=\"1\">\n<li><strong>Re-read (10 min).<\/strong> Read this week's five notes in\nthe log below.<\/li>\n<li><strong>Pick the hardest topic (5 min).<\/strong> Choose the one you\nfeel least sure about.<\/li>\n<li><strong>Explain it in 2 minutes, without notes (15 min).<\/strong>\nRecord it on your phone. Listen back. Do it again, better.<\/li>\n<li><strong>Write one plain paragraph (10 min)<\/strong> that a fish\nprocessor in James Town would understand. No jargon.<\/li>\n<li><strong>Answer 3 hard questions (20 min)<\/strong> from the bank\nbelow, out loud, as if a provost or funder asked you.<\/li>\n<\/ol>\n<p>Once a month, explain one topic to your co-author or an intern and\nask them to challenge you.<\/p>\n<p><strong>Hard questions bank<\/strong><\/p>\n<ul>\n<li>How do you know the new stove actually saves wood, and isn't just\nused on good days?<\/li>\n<li>Cookstove credits have been over-credited by about 9 times. Why\nshould anyone trust yours?<\/li>\n<li>Who owns the carbon credits, and how much reaches the women?<\/li>\n<li>Does the Ahotor meet L.I. 2454? If not, why pilot it?<\/li>\n<li>What happens if processors go back to the Chorkor after the study\nends?<\/li>\n<li>Your sample is small. Why should we believe your results?<\/li>\n<li>What does your fNRB value come from?<\/li>\n<li>How is your stove design different from the Ahotor and the FTT?<\/li>\n<li>What does it cost per tonne of CO₂ reduced?<\/li>\n<li>How will the sensor data stay secure and honest?<\/li>\n<li>Why are you the right team to do this?<\/li>\n<li>What's the single most important finding of your baseline\nstudy?<\/li>\n<\/ul>\n"}, "sun": {"title": "Sunday: Leadership & reflection (17:00–17:30, light)", "html": "<p>Sunday is your rest day, so keep this gentle: 15 minutes of reading\nand 15 minutes of reflection. Read one chapter at a time, in this\norder:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr class=\"header\">\n<th>Order<\/th>\n<th>Book<\/th>\n<th>Why read it<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>1<\/td>\n<td><em>The Blue Sweater<\/em>, Jacqueline Novogratz<\/td>\n<td>A founder learning to build impact businesses in Africa<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>2<\/td>\n<td><em>Poor Economics<\/em>, Banerjee &amp; Duflo<\/td>\n<td>Why people adopt, or don't adopt, new technology like stoves<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>3<\/td>\n<td><em>Start with Why<\/em>, Simon Sinek<\/td>\n<td>Explaining your purpose so others want to join<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>4<\/td>\n<td><em>Manifesto for a Moral Revolution<\/em>, Jacqueline Novogratz<\/td>\n<td>Leading with humility and accountability<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Reflection (write 3 short answers)<\/strong><\/p>\n<ul>\n<li>What went well this week, and what am I grateful for?<\/li>\n<li>What was hardest, and what did I learn from it?<\/li>\n<li>What is the one thing I most want to understand better next\nweek?<\/li>\n<\/ul>\n"}, "gloss": "<div class=\"tw\"><table>\n<thead>\n<tr class=\"header\">\n<th>Term<\/th>\n<th>Plain meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Additionality<\/td>\n<td>The reductions would not happen without carbon money<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Article 6<\/td>\n<td>Part of the Paris Agreement that lets countries trade emission\nreductions<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Baseline<\/td>\n<td>What would happen without the project, e.g. the Chorkor kiln<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>CCP<\/td>\n<td>Core Carbon Principles, the ICVCM quality label for credits<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>CO<\/td>\n<td>Carbon monoxide, a poisonous gas from incomplete burning<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Corresponding adjustment<\/td>\n<td>The selling country removes the credits from its own climate target\nso they aren't counted twice<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>fNRB<\/td>\n<td>Share of wood taken faster than forests regrow; only this share\nearns credits<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>ISO 19867-1<\/td>\n<td>International lab test for cookstove performance<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>ITMO<\/td>\n<td>Internationally Transferred Mitigation Outcome, a credit traded\nunder Article 6<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>L.I. 2454<\/td>\n<td>Ghana's legal standard and labelling rules for cookstoves<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>MRV<\/td>\n<td>Measurement, Reporting and Verification<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>PAHs<\/td>\n<td>Cancer-causing compounds formed when fat burns in smoke<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>PM₂.₅<\/td>\n<td>Tiny smoke particles that go deep into the lungs<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Stacking<\/td>\n<td>Using the old and new stoves side by side<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>tCO₂e<\/td>\n<td>One tonne of CO₂ or its equivalent: one carbon credit<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Verification<\/td>\n<td>An independent auditor checks the data before credits are\nissued<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n", "sources": "<ul>\n<li><a\nhref=\"https://interactive.carbonbrief.org/carbon-offsets-2023/\">Carbon\nBrief, Q&amp;A on carbon offsets<\/a><\/li>\n<li><a\nhref=\"https://globalgoals.goldstandard.org/430_ee_ics_methodology-for-metered-measured-energy-cooking-devices/\">Gold\nStandard, MECD methodology<\/a><\/li>\n<li><a\nhref=\"https://verra.org/methodologies/vm0050-energy-efficiency-and-fuel-switch-measures-in-cookstoves-v1-0/\">Verra,\nVM0050<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://cleancooking.org/4c/methodology\">Clean Cooking\nAlliance, CLEAR Methodology<\/a><\/li>\n<li><a\nhref=\"https://mecs.org.uk/blog/why-metered-carbon-credits-matter-for-clean-cooking-and-how-the-debate-is-moving-on/\">MECS,\nwhy metered carbon credits matter<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.pewresearch.org/writing-survey-questions/\">Pew\nResearch Center, Writing Survey Questions<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://doi.org/10.1191/1478088706qp063oa\">Braun &amp;\nClarke (2006)<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://r4ds.hadley.nz/\">R for Data Science<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://doi.org/10.1371/journal.pcbi.1005619\">Mensh &amp;\nKording (2017)<\/a><\/li>\n<li><a\nhref=\"https://files.peacecorps.gov/documents/M0091_ANNEX_Cookstoves_TP_ICS_1_Improved-Cookstoves-Handbook.pdf\">Peace\nCorps Improved Cookstoves Handbook<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.iso.org/standard/66519.html\">ISO\n19867-1:2018<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://doi.org/10.1289/EHP9873\">Weyant et al.\n(2022)<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://doi.org/10.1371/journal.pcbi.0020012\">Bourne &amp;\nChalupa (2006)<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://acumenacademy.org\">Acumen Academy<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.ycombinator.com/library\">Y Combinator Startup\nLibrary<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://icvcm.org/core-carbon-principles/\">ICVCM Core\nCarbon Principles<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://doi.org/10.1038/s41893-023-01259-6\">Gill-Wiehl,\nKammen &amp; Haya (2024)<\/a><\/li>\n<li><a\nhref=\"https://klik.ch/news/news-article/first-itmo-transfer-switzerland-ghana\">KliK\nFoundation, first ITMO transfer Switzerland–Ghana<\/a><\/li>\n<li><a\nhref=\"https://gna.org.gh/2025/03/ghanas-carbon-market-to-generate-over-1-billion-by-2030/\">GNA,\nGhana's carbon market by 2030<\/a><\/li>\n<\/ul>\n", "videos": {"mon-1": [["91Ss1ZhS7zE", "Carbon Credits Explained: What They Are, and What They Aren't"], ["Aw9ZfE4GLXI", "Carbon credits help expand Kenyan cookstove company"]], "mon-2": [["BNDVS--kkJU", "Navigating the complexities of carbon finance in clean cooking"], ["HZBblsV3l6Y", "What is MRV? (Measurement, Reporting and Verification)"]], "mon-3": [["HzAtDwv7LhU", "Verra & DelAgua: Transforming lives through clean cooking"], ["CVKooh0Ou7o", "What are carbon standards? (Verra, Gold Standard and others)"]], "mon-4": [["op32b803ZHw", "Launching the Buyer's Guide to High-Quality Cookstove Carbon Credits"], ["Mf2RsdTe96Q", "Clean cooking: financing, policy and innovation for last-mile impact"]], "tue-1": [["_zoIVE9PRTM", "How to design a questionnaire or survey"], ["LnbJUA67W80", "How to ask good survey questions"]], "tue-2": [["wK04kTxc5tg", "Thematic analysis explained: the 6 steps by Braun & Clarke (2006)"], ["5zFcC10vOVY", "Thematic analysis: an introduction"]], "tue-3": [["FIrsOBy5k58", "RStudio for the total beginner"], ["Jvw794R23lQ", "R tutorial: paired samples t-test"]], "tue-4": [["udJ3AnS2veU", "How to write a scientific paper from start to finish"], ["Xk4CzX2UjS0", "How to write a peer-reviewed research paper"]], "wed-1": [["phrz7VjQdGo", "The ten principles of rocket stove construction"], ["iQOQNSUxjcE", "The FAO-Thiaroye processing technique (FTT)"], ["jCksZPEP5ac", "Rocket stove: how it works"]], "wed-2": [["kRwVih1E6Gk", "Using the LEMS for real-time cookstove improvement"], ["feflCYGLKOo", "Cook stove regulation: CSIR urges Ghanaians to embrace clean cook stoves"]], "wed-3": [["SlbDV9FiFB0", "Can a cleaner cookstove save lives?"], ["7f68-8c94CU", "Air monitoring and PM2.5: methods, regulations and analysis"]], "wed-4": [["B3-BLX76jJE", "Quantifying carbon removal with IoT: dMRV explained"], ["5HYM2zhYlhs", "dMRV platform demo for a clean cooking project"]], "thu-1": [["Cw0n9kUpG0g", "How to write a grant proposal: a step-by-step guide"], ["KyAeMYNeZpw", "How to write a grant proposal: 4 golden rules"]], "thu-2": [["t8XdBe9l0rQ", "Financial modeling for social enterprises"], ["22zUFGPfhZE", "Business model canvas for a social enterprise"]], "thu-3": [["lw2X3PxKlAY", "How to pitch your seed-stage startup, Michael Seibel (Y Combinator)"], ["17XZGUX_9iM", "Kevin Hale: How to pitch your startup"]], "thu-4": [["t_2OKqHJrvU", "Communities, natural capital and carbon credits"], ["a4IMk-pzPMQ", "Building inclusive carbon markets: gender and social inclusion lessons"]], "fri-1": [["6scZT-hkUd8", "A guide to ICVCM's Core Carbon Principles (CCPs)"], ["pBd0fbsFdZo", "Introducing the updated Core Carbon Principles"]], "fri-2": [["re-_WyOFvPw", "How can carbon offsets be reformed?"], ["61SWIYwCaSE", "Why carbon offsets are worse than you think"]], "fri-3": [["eZmjUP8WzIs", "Developing national Article 6 frameworks: lessons from Ghana and Switzerland"], ["Tubys306k0E", "Article 6 carbon markets: buyers and sellers"]], "fri-4": [["NuBDPITpXoY", "Ghana's strides to ensure clean cooking"], ["CA9-nDy_7fQ", "Clean cooking in Ghana: 3 million stoves by 2030"], ["IDk-UHRXumw", "Energy Minister targets 50% household transition to clean cooking by 2030"]], "start": [["4FNpx8VvyIE", "Clean cooking: why it matters"]], "sun": [["x4m6j7rSyzY", "Jacqueline Novogratz: A third way to think about aid"], ["u4ZoJKF_VuA", "Simon Sinek: How great leaders inspire action"]]}};var Q={"mon-1": [{"q": "One carbon credit represents…", "o": ["One tonne of CO₂ (or equivalent) kept out of the air", "One kilogram of wood saved", "One improved stove handed out", "One US dollar of climate finance"], "a": 0, "w": "A credit is a unit of 1 tCO₂e. Stoves and wood saved are how you get there, not the unit itself."}, {"q": "Why does fNRB matter so much in a cookstove project?", "o": ["It sets the price buyers pay", "Only wood taken faster than forests regrow counts as an emission reduction", "It measures how much smoke a stove makes", "It is the stove's efficiency rating"], "a": 1, "w": "fNRB is the share of wood that is non-renewable. Credits scale directly with it, so an inflated fNRB inflates every credit."}, {"q": "For the James Town pilot, the baseline is…", "o": ["The Ahotor's lab test result", "Zero emissions", "Fuel use and emissions with the traditional Chorkor smoker", "Ghana's national average for households"], "a": 2, "w": "The baseline is what would happen without the project: processors smoking on the Chorkor as they do today."}], "mon-2": [{"q": "What makes the Gold Standard MECD method different?", "o": ["Credits are based on energy measured at the device", "Credits are based on household surveys", "Credits come from satellite images", "Credits are based on the number of stoves sold"], "a": 0, "w": "MECD means metered and measured: the evidence comes from meters and sensors, not estimates."}, {"q": "Why could the Data Vault matter for carbon credits?", "o": ["It replaces the need for a verifier", "Measured, timestamped data can support metered crediting", "It sets the carbon price", "It makes stoves more efficient"], "a": 1, "w": "Audit-ready sensor data is the kind of evidence a metered method needs. A verifier still checks it."}, {"q": "What is the main caution when applying MECD to fish smokers?", "o": ["It is only for Asia", "It forbids sensors", "It was written mainly for electric and gas stoves, so the fit for biomass smokers must be checked", "It has no monitoring rules"], "a": 2, "w": "Always check a methodology's applicability conditions before planning a project around it."}], "mon-3": [{"q": "Why is Verra VM0050 stricter than older cookstove methods?", "o": ["It was a response to over-crediting, with more conservative parameters", "It allows higher fNRB values", "It removes monitoring", "It only covers gas stoves"], "a": 0, "w": "VM0050 tightened defaults and monitoring after evidence that older methods over-credited."}, {"q": "VM0050 requires projects to…", "o": ["Assume every stove is used every day", "Check that stoves are actually used", "Skip the baseline", "Sell credits before installation"], "a": 1, "w": "Usage monitoring stops projects claiming savings from stoves sitting unused in a corner."}, {"q": "When comparing two methodologies, which question matters most?", "o": ["Which logo looks better", "Which is older", "Who measures, how often, and how conservative the assumptions are", "Which has the longest document"], "a": 2, "w": "Measurement, frequency and conservativeness decide how credible the credits are."}], "mon-4": [{"q": "What is CLEAR designed to fix?", "o": ["Slow stove sales", "Over-crediting in older cookstove methods", "High stove prices", "Weak stove designs"], "a": 1, "w": "CLEAR uses measured fuel use and conservative, up-to-date defaults to avoid over-crediting."}, {"q": "Why is integrity a selling point for Carbon Clarity?", "o": ["Buyers pay more for high-integrity credits, and it protects the project's reputation", "It makes verification free", "It removes the need for data", "It guarantees a fixed price"], "a": 0, "w": "High-integrity credits command better prices and survive the scrutiny that sank weaker projects."}, {"q": "A buyer asks how they know your credits are real. The strongest answer is…", "o": ["Our stoves look modern", "We measure actual fuel use, use conservative assumptions, and an independent verifier checks the data", "We trust the processors", "Other projects do the same"], "a": 1, "w": "Measurement, conservativeness and independent verification are the three pillars buyers look for."}], "tue-1": [{"q": "Which survey question is leading?", "o": ["How many kg of wood did you use yesterday?", "Don't you agree the new stove is better?", "How many batches did you smoke this week?", "What do you pay for a bundle of wood?"], "a": 1, "w": "A leading question pushes the answer you want. Ask neutral questions about facts."}, {"q": "What should you do before running the full survey?", "o": ["Publish the results", "Pilot it with 3–5 processors in Ga or Twi", "Double the number of questions", "Translate it only after collecting data"], "a": 1, "w": "A small pilot finds confusing questions before they ruin your real data."}, {"q": "Why record fuel, cost and exposure the same way at baseline and after the pilot?", "o": ["To save paper", "It is required by law", "Otherwise you can't compare before and after", "So the survey is shorter"], "a": 2, "w": "Comparisons only mean something if both rounds measured things the same way."}], "tue-2": [{"q": "How many phases are in Braun & Clarke's thematic analysis?", "o": ["Three", "Four", "Six", "Ten"], "a": 2, "w": "Six: familiarise, code, find themes, review themes, name them, write up."}, {"q": "A theme is…", "o": ["One striking quote you like", "A pattern across many interviews", "The interview question", "A word that appears often"], "a": 1, "w": "Themes are patterns of meaning across the data set, not single quotes or word counts."}, {"q": "Why keep an audit trail (codebook, dates, who coded)?", "o": ["So a reviewer can trust the analysis", "To make the paper longer", "It is only needed for statistics", "To hide disagreements"], "a": 0, "w": "An audit trail shows how you got from raw interviews to your themes."}], "tue-3": [{"q": "A paired t-test compares…", "o": ["Two different groups of people", "The same processors before and after", "Three or more groups", "Two survey questions"], "a": 1, "w": "Paired means the same people measured twice, e.g. wood per batch on the Chorkor and then on the Ahotor."}, {"q": "Standard deviation describes…", "o": ["The middle value", "The spread of the values", "The largest value", "The sample size"], "a": 1, "w": "Mean and median describe the middle; standard deviation describes how spread out the values are."}, {"q": "With a small pilot, the best way to report a result is…", "o": ["Only say whether it is 'significant'", "Report the size of the difference with a confidence interval", "Report only the largest saving", "Avoid numbers"], "a": 1, "w": "Effect size with a confidence interval tells readers how big the change is and how sure you can be."}], "tue-4": [{"q": "How many central messages should a paper have?", "o": ["One", "Three", "As many as possible", "None"], "a": 0, "w": "One central message, which every section serves."}, {"q": "How should each paragraph start?", "o": ["With a quote", "With its main point", "With a citation", "With background"], "a": 1, "w": "Leading with the point lets busy reviewers follow your argument."}, {"q": "What do reviewers usually look at first?", "o": ["The references", "The appendix", "The title, abstract and figures", "The acknowledgements"], "a": 2, "w": "Make the title, abstract and figures strong: they shape the first impression."}], "wed-1": [{"q": "Clean burning depends on the 'three Ts'. They are…", "o": ["Temperature, turbulence, time", "Tin, timber, tar", "Temperature, tonnage, tax", "Time, tests, training"], "a": 0, "w": "Enough heat, good mixing of air and gases, and enough time for the gases to burn."}, {"q": "What makes the most harmful smoke in fish smoking?", "o": ["Wet fish", "Fat dripping onto the fire, forming PAHs", "Using a metal tray", "Smoking in the morning"], "a": 1, "w": "Burning fat creates PAHs, cancer-causing compounds. Good designs keep fat away from the flame."}, {"q": "Smoke is mostly…", "o": ["Steam", "Unburnt fuel", "Pure carbon dioxide", "Dust from the fish"], "a": 1, "w": "Smoke is fuel that didn't burn completely, so less smoke usually means less wood wasted."}], "wed-2": [{"q": "ISO 19867-1 is…", "o": ["A carbon credit standard", "A laboratory test protocol for cookstove performance", "A Ghana tax rule", "A fish quality standard"], "a": 1, "w": "It tests efficiency, emissions, safety and durability, scored in tiers."}, {"q": "Under L.I. 2454, the minimum efficiency for wood stoves is…", "o": ["15%", "25%", "35%", "50%"], "a": 1, "w": "At least 25% for wood. Charcoal stoves need above 35%."}, {"q": "Why measure stoves in the field as well as in the lab?", "o": ["Lab results are often better than real use", "Labs are illegal in Ghana", "Field tests are always cheaper", "Labs can't measure smoke"], "a": 0, "w": "Real cooks, real fuel and real habits change performance, so field data shows the true picture."}], "wed-3": [{"q": "PM₂.₅ is…", "o": ["A type of wood", "Tiny particles that go deep into the lungs", "A carbon credit unit", "A stove model"], "a": 1, "w": "Fine particles 2.5 micrometres or smaller, linked to lung and heart disease."}, {"q": "What best shows what a processor actually breathes?", "o": ["A sensor on the chimney", "A personal monitor she wears", "The stove's lab rating", "A survey question"], "a": 1, "w": "Personal monitors measure exposure at the breathing zone, not just what the kiln emits."}, {"q": "A good exposure study design is…", "o": ["Different women before and after, any day", "The same women before and after, doing the same tasks, for 24–48 hours", "One reading of 5 minutes", "Only measuring on rainy days"], "a": 1, "w": "Same people, same tasks and long enough monitoring make the comparison fair."}], "wed-4": [{"q": "'Audit-ready' data means…", "o": ["Data typed into WhatsApp", "Raw data kept, device IDs, changes logged, calibration recorded", "Only summary tables", "Data collected once a year"], "a": 1, "w": "A verifier must be able to trace every number back to a device and a time."}, {"q": "Which can sensors record automatically?", "o": ["Temperature, run time and fuel weight, with timestamps", "The processor's opinions", "The carbon price", "The fNRB value"], "a": 0, "w": "Sensors capture physical measurements; context still comes from surveys and records."}, {"q": "Good data serves which parts of Carbon Clarity?", "o": ["Only the paper", "Only carbon credits", "The paper, the stove design and carbon credits", "None until Phase 3"], "a": 2, "w": "The same data can support all three phases if it is collected well from the start."}], "thu-1": [{"q": "What should you do first when writing a grant?", "o": ["Write the budget", "Read the funder's goals", "Choose a title", "Ask for the maximum amount"], "a": 1, "w": "Write to the funder's goals, using your evidence."}, {"q": "A strong grant structure is…", "o": ["Budget → team → problem", "Problem → what you'll do → why you → budget → results", "Results → budget → problem", "Team photos → history → budget"], "a": 1, "w": "Lead with the problem and end with measurable results."}, {"q": "Before submitting, you should…", "o": ["Submit at the last minute", "Ask a colleague to review it as a reviewer would", "Add more pages", "Remove all numbers"], "a": 1, "w": "A fresh reader catches gaps you can no longer see."}], "thu-2": [{"q": "Revenue per stove from carbon is…", "o": ["Stove price × 2", "Credits per stove × price per credit", "Wood saved × fuel price", "Number of processors × 100"], "a": 1, "w": "Then subtract verification costs and the processors' benefit share."}, {"q": "Why test low, middle and high carbon prices?", "o": ["Carbon prices are uncertain", "Buyers always pay the highest price", "It is required by Gold Standard", "To make the model longer"], "a": 0, "w": "Planning only for the best price is how projects run out of money."}, {"q": "What must you subtract from carbon revenue?", "o": ["Nothing", "Verification costs and the processors' benefit share", "Only taxes", "Only stove costs"], "a": 1, "w": "Monitoring, verification and fair benefit-sharing are real costs of a credible project."}], "thu-3": [{"q": "In the first 30 seconds of a pitch, say…", "o": ["Your life story", "The problem, who has it, your solution and the proof so far", "Your budget in detail", "Your team's degrees"], "a": 1, "w": "Hook the listener with the problem and the evidence that your solution works."}, {"q": "A memorable pitch uses…", "o": ["Many numbers", "One striking number", "No numbers", "Only charts"], "a": 1, "w": "One number people remember (e.g. hours of smoke exposure a day) beats ten they forget."}, {"q": "How should a pitch end?", "o": ["With thanks only", "With a clear ask: money, a partner or an introduction", "With a joke", "With your contact details only"], "a": 1, "w": "Tell people exactly what you want them to do next."}], "thu-4": [{"q": "Every partnership agreement should state…", "o": ["Only the start date", "Who does what, who owns the data, who owns the carbon credits, and how money is shared", "Only the budget", "Only the partners' logos"], "a": 1, "w": "Data and credit ownership disputes are common. Settle them in writing first."}, {"q": "Benefit-sharing with processors must be…", "o": ["Decided after credits are sold", "Written down before credits are sold and agreed with the women", "Kept secret", "Set by the buyer"], "a": 1, "w": "Fair, agreed and written benefit-sharing protects the women and the project's integrity."}, {"q": "Before signing anything about carbon rights, you should…", "o": ["Sign quickly", "Get legal advice", "Ask on social media", "Wait for the buyer to decide"], "a": 1, "w": "Carbon rights are legal rights. Get advice before you commit."}], "fri-1": [{"q": "Additionality means…", "o": ["The project adds more stoves", "The reductions would not happen without carbon money", "Adding extra monitoring", "Adding a second buyer"], "a": 1, "w": "If the stoves would have been used anyway, the credits aren't additional."}, {"q": "Who sets the Core Carbon Principles?", "o": ["Verra", "The ICVCM", "Ghana's Energy Commission", "The World Bank"], "a": 1, "w": "The Integrity Council for the Voluntary Carbon Market (ICVCM) sets the CCPs."}, {"q": "A CCP label on a credit usually means…", "o": ["It passed an integrity assessment and often sells for more", "It is free", "It was issued in Ghana", "It can be counted twice"], "a": 0, "w": "The label signals the methodology and programme met the integrity principles."}], "fri-2": [{"q": "Gill-Wiehl, Kammen & Haya (2024) found cookstove projects claimed about…", "o": ["The right amount", "2 times too much", "9 times more reductions than achieved", "100 times too much"], "a": 2, "w": "Roughly 9 times, driven mainly by inflated fNRB, overestimated use and stacking."}, {"q": "Which is a main cause of over-crediting?", "o": ["Measuring fuel use", "fNRB set too high", "Using conservative defaults", "Independent verification"], "a": 1, "w": "Inflated fNRB, overestimated stove use and stacking were the main drivers."}, {"q": "'Stacking' means…", "o": ["Piling wood", "Using the old and new stoves side by side", "Selling credits twice", "Stacking fish on trays"], "a": 1, "w": "If the Chorkor keeps being used next to the new oven, real savings are smaller than claimed."}], "fri-3": [{"q": "An ITMO is…", "o": ["A type of stove", "An Internationally Transferred Mitigation Outcome traded under Article 6", "A Ghana tax", "A carbon registry"], "a": 1, "w": "ITMOs let one country count reductions achieved in another."}, {"q": "A corresponding adjustment means…", "o": ["The buyer pays more", "The selling country removes the reductions from its own climate target so they aren't counted twice", "The stove is adjusted", "The price is adjusted for inflation"], "a": 1, "w": "It prevents double counting between the host and buyer countries."}, {"q": "Ghana was among the first countries to…", "o": ["Ban cookstoves", "Transfer Article 6 credits from a cookstove project to Switzerland", "Leave the Paris Agreement", "Set a carbon tax on fish"], "a": 1, "w": "A cookstove project generated one of the first Article 6 transfers, to Switzerland."}], "fri-4": [{"q": "L.I. 2454 sets…", "o": ["Fish prices", "Minimum stove performance and labelling rules", "Carbon prices", "Fishing seasons"], "a": 1, "w": "It keeps poor-quality stoves off the market through performance standards and labels."}, {"q": "The minimum safety score under L.I. 2454 is…", "o": ["50", "70", "85", "100"], "a": 2, "w": "At least 85, alongside the efficiency thresholds."}, {"q": "What policy opportunity does Carbon Clarity have?", "o": ["None", "Its pilot data could help the Energy Commission set a standard for fish smokers", "To avoid regulation", "To write the law itself"], "a": 1, "w": "Good field data can inform a standard for commercial fish smokers."}]};

 h+='<div class="card"><h2>By track</h2><div class="tw"><table><thead><tr><th>Track</th><th>Lessons completed</th><th>Mastery</th></tr></thead><tbody>'+DAYS.map(function(d){var s=trackStats(d[0]);return "<tr><td>"+esc(d[2])+"</td><td>"+s.done+"/4</td><td>"+s.mastery+"%</td></tr>"}).join("")+"</tbody></table></div></div>";
 h+='<div class="card"><h2>Achievements</h2><div class="badges">'+b.map(function(x){return '<div class="badge'+(x[2]?" got":"")+'"><b>'+x[0]+'</b><span>'+esc(x[1])+"</span></div>"}).join("")+'</div><div class="row"><button class="btn pri" id="copyPass">Copy my passport</button><span class="saved" id="pMsg"></span></div></div>';
 render(h,"passport");$("copyPass").onclick=function(){var t="Carbon Clarity Learning · skills passport · "+new Date().toLocaleDateString("en-GB")+"\nLessons completed: "+o.done+"/20 · Mastery: "+o.mastery+"%\n"+DAYS.map(function(d){var s=trackStats(d[0]);return "- "+d[2]+": "+s.done+"/4 lessons, mastery "+s.mastery+"%"}).join("\n")+"\nAchievements: "+b.filter(function(x){return x[2]}).map(function(x){return x[1]}).join("; ")+"\n";try{navigator.clipboard.writeText(t).then(function(){$("pMsg").textContent="Copied."},function(){$("pMsg").textContent="Couldn't copy."})}catch(e){}}}

/* ---------- shared blocks ---------- */
function player(list,el,onPlay){var i=0;function draw(){var v=list[i];el.querySelector(".pw").innerHTML='<div class="player"><img alt="" src="https://i.ytimg.com/vi/'+v[0]+'/hqdefault.jpg"><button class="play" aria-label="Play video: '+esc(v[1])+'"><b></b></button></div><div class="vmeta"><strong>'+esc(v[1])+'</strong><a target="_blank" rel="noopener" href="https://www.youtube.com/watch?v='+v[0]+'">Open on YouTube ↗</a></div>';
 el.querySelector(".play").onclick=function(){el.querySelector(".player").innerHTML='<iframe src="https://www.youtube-nocookie.com/embed/'+v[0]+'?autoplay=1&rel=0" title="'+esc(v[1])+'" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>';if(onPlay)onPlay()};
 var m=el.querySelector(".more");if(m){m.innerHTML=list.length>1?list.map(function(x,j){return '<button class="vt'+(j===i?" on":"")+'" data-j="'+j+'"><img alt="" loading="lazy" src="https://i.ytimg.com/vi/'+x[0]+'/mqdefault.jpg"><span>'+esc(x[1])+"</span></button>"}).join(""):"";m.querySelectorAll(".vt").forEach(function(b){b.onclick=function(){i=+b.dataset.j;draw()}})}}draw()}
function videoBlock(list,label){return '<div class="card"><h2>'+(label||"Watch")+'</h2><div class="pw"></div><div class="more"></div></div>'}
function notesBlock(id){var q=["Today I learned…","It matters for Carbon Clarity because…","I could explain it to a fisher, a funder or a professor as…"];var lesson=/^(mon|tue|wed|thu|fri)-/.test(id);
 return '<div class="card notes" id="s-n"><h2>'+(lesson?'<span class="sn">5</span>':"")+'Reflect: your 3 sentences</h2><p class="hint" style="margin:0">Saved on this device as you type. Use "Copy & open Google Doc" to keep a permanent copy.</p>'+q.map(function(t,i){return '<label for="n'+i+'">'+t+'</label><textarea id="n'+i+'" data-k="cc_note_'+id+'_'+i+'">'+esc(ls("cc_note_"+id+"_"+i)||"")+"</textarea>"}).join("")+
 '<div class="row">'+(lesson?'<button class="btn pri" id="doneBtn"></button>':"")+'<button class="btn" id="gdocBtn">Copy & open Google Doc</button><span class="saved" id="saved"></span></div></div>'}
function wireNotes(id){var lesson=/^(mon|tue|wed|thu|fri)-/.test(id);document.querySelectorAll("textarea[data-k]").forEach(function(t){t.oninput=function(){ls(t.dataset.k,t.value);$("saved").textContent="Saved";if(lesson&&t.value.trim().length>20)setAct(id,"n")}});
 $("gdocBtn").onclick=function(){var L=["Today I learned: ","It matters for Carbon Clarity because: ","I could explain it as: "];var txt=new Date().toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"})+" · "+name(id)+"\n"+[0,1,2].map(function(i){return L[i]+($("n"+i).value.trim()||"—")}).join("\n")+"\n";window.open(GDOC,"_blank");try{navigator.clipboard.writeText(txt).then(function(){$("saved").textContent="Copied. Paste it at the bottom of the Google Doc."},function(){$("saved").textContent="Couldn't copy automatically. Select your sentences and copy them."})}catch(e){}};
 if(!lesson)return;var b=$("doneBtn");function lab(){b.textContent=done(id)?"✓ Completed (tap to undo)":"Mark lesson complete";b.className=done(id)?"btn":"btn pri"}lab();b.onclick=function(){var was=done(id);ls("cc_done_"+id,was?"0":"1");if(!was){ls("cc_doneat_"+id,ymd());logDay();toast("Lesson completed.")}lab();nav(id);header()}}
function name(k){var p=k.split("-");if(dayOf(k))return dayOf(k)[1]+" Week "+p[1]+": "+title(k);return(p[0]==="sat"?"Saturday practice ":"Sunday reflection ")+(p[1]||"")}
function weekend(k){var d=D[k],key=k+"-"+isoWeek();var h='<div class="card"><h1>'+esc(d.title)+"</h1></div>";if(k==="sun"&&D.videos.sun)h+=videoBlock(D.videos.sun,"Watch (optional)");h+='<div class="card">'+d.html+"</div>"+notesBlock(key);render(h,k);if(k==="sun")player(D.videos.sun,document.querySelector("#view > .card:nth-child(2)"));wireNotes(key);logDay()}
function isoWeek(){var d=new Date();d.setHours(0,0,0,0);return d.getFullYear()+"w"+Math.floor((d-new Date(d.getFullYear(),0,1))/6048e5)}
function library(){var h='<div class="card"><h1>Video library</h1><p class="hint">Every video in the programme, by topic. Tap one to go to its lesson.</p></div>';
 DAYS.forEach(function(d){h+='<div class="card"><h2>'+d[1]+" · "+d[2]+'</h2><div class="more">';for(var w=1;w<=4;w++)D.videos[d[0]+"-"+w].forEach(function(v){h+='<a class="vt" style="text-decoration:none" href="#'+d[0]+"-"+w+'"><img alt="" loading="lazy" src="https://i.ytimg.com/vi/'+v[0]+'/mqdefault.jpg"><span>Week '+w+" · "+esc(v[1])+"</span></a>"});h+="</div></div>"});render(h,"videos")}
function notes(){var items=[];try{Object.keys(localStorage).forEach(function(k){var m=k.match(/^cc_note_(.+)_(\d)$/);if(m&&ls(k))items.push([m[1],+m[2],ls(k)])})}catch(e){}
 var by={};items.forEach(function(x){(by[x[0]]=by[x[0]]||[])[x[1]]=x[2]});var keys=Object.keys(by).sort();var lbls=["Today I learned","Why it matters","How I'd explain it"];
 var h='<div class="card"><h1>My notes</h1><p class="hint">These are saved in this browser. Your permanent copy is the <a href="'+GDOC+'" target="_blank" rel="noopener">notes Google Doc</a>.</p><div class="row"><button class="btn pri" id="dl">Download my notes (.txt)</button></div></div><div class="card">';
 h+=keys.length?keys.map(function(k){return '<div class="note-item"><a href="#'+k+'"><strong>'+esc(name(k))+"</strong></a>"+by[k].map(function(t,i){return t?"<p><em>"+lbls[i]+":</em> "+esc(t)+"</p>":""}).join("")+"</div>"}).join(""):"<p>No notes yet. Write your three sentences at the end of each lesson.</p>";
 render(h+"</div>","notes");$("dl").onclick=function(){var txt=keys.map(function(k){return name(k)+"\n"+by[k].map(function(t,i){return t?lbls[i]+": "+t:""}).filter(Boolean).join("\n")}).join("\n\n");var b=new Blob([txt||"No notes yet."],{type:"text/plain"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="carbon-clarity-learning-notes.txt";document.body.appendChild(a);a.click();a.remove()}}
function route(){try{speechSynthesis.cancel()}catch(e){}var id=(location.hash||"#home").slice(1);
 if(/^(mon|tue|wed|thu|fri)-[1-4]$/.test(id))lesson(id);else if(/^rev-(mon|tue|wed|thu|fri)-[1-4]$/.test(id))revOne(id.slice(4));else if(id==="revise")revise();else if(id==="sat"||id==="sun")weekend(id);else if(id==="lab")lab();else if(id==="passport")passport();else if(id==="videos")library();
 else if(id==="readings")render('<div class="card"><h1>Readings</h1><p class="hint">Every reading in the programme. All open in a new tab.</p>'+D.sources+"</div>","readings");
 else if(id==="glossary")render('<div class="card"><h1>Glossary</h1><div class="tw">'+D.gloss+"</div></div>","glossary");else if(id==="notes")notes();else home()}
/* migrate old completions so the week count works */
ids().forEach(function(id){if(done(id)&&!ls("cc_doneat_"+id))ls("cc_doneat_"+id,ymd())});
$("todayBtn").onclick=function(){location.hash=todayId()};window.onhashchange=route;route();
