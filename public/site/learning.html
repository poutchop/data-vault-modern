<style>
:root{--bg:#F3F6F2;--card:#fff;--ink:#14261F;--muted:#55675F;--accent:#0F7C72;--accent-ink:#fff;--line:#D9E2DC;--soft:#E6F0EC;--warn:#B4561D}
@media (prefers-color-scheme:dark){:root{--bg:#0E1814;--card:#15231E;--ink:#E5EEE9;--muted:#9FB2A9;--accent:#4FC3B5;--accent-ink:#06201C;--line:#26372F;--soft:#1B2D27;--warn:#F0A36B}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--accent)}button{font:inherit;cursor:pointer}
.top{background:var(--accent);color:var(--accent-ink);padding:14px 16px}.top .w{max-width:1180px;margin:auto;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.brand{font-weight:800;font-size:19px;letter-spacing:.2px}.brand small{display:block;font-weight:500;font-size:13px;opacity:.85}
.prog{min-width:220px;flex:1;max-width:360px}.prog .bar{height:8px;border-radius:99px;background:rgba(255,255,255,.3);overflow:hidden}.prog .bar i{display:block;height:100%;background:var(--accent-ink);width:0;transition:width .3s}
.prog span{font-size:13px;opacity:.9}
.today{background:var(--accent-ink);color:var(--accent);border:0;border-radius:99px;padding:8px 16px;font-weight:700}
.layout{max-width:1180px;margin:auto;display:grid;grid-template-columns:250px 1fr;gap:24px;padding:20px 16px 60px}
aside{position:sticky;top:12px;align-self:start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;max-height:calc(100vh - 24px);overflow:auto}
aside h4{margin:12px 8px 4px;font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}aside h4:first-child{margin-top:4px}
aside a{display:flex;justify-content:space-between;gap:8px;padding:6px 10px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:14.5px}
aside a:hover{background:var(--soft)}aside a.on{background:var(--accent);color:var(--accent-ink)}aside a .ck{color:var(--accent);font-weight:700}aside a.on .ck{color:var(--accent-ink)}
main{min-width:0}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:18px}
.crumb{color:var(--muted);font-size:14px;margin:0 0 4px}h1{margin:0 0 6px;font-size:clamp(24px,4vw,32px);line-height:1.2}h2{font-size:20px;margin:0 0 10px}h3{font-size:17px;margin:18px 0 6px}
.player{position:relative;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
.player img{width:100%;height:100%;object-fit:cover;display:block;opacity:.85}.player button.play{position:absolute;inset:0;border:0;background:transparent;display:flex;align-items:center;justify-content:center}
.player button.play b{width:76px;height:54px;border-radius:14px;background:#E0262B;display:flex;align-items:center;justify-content:center}.player button.play b:after{content:"";border-left:20px solid #fff;border-top:12px solid transparent;border-bottom:12px solid transparent;margin-left:5px}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vmeta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 14px;margin:10px 0 0;font-size:15px}.vmeta strong{flex:1;min-width:200px}
.more{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:14px}
.vt{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:0;text-align:left;color:var(--ink);overflow:hidden}.vt img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}.vt span{display:block;padding:7px 9px;font-size:13.5px;line-height:1.35}.vt.on{outline:3px solid var(--accent)}
.formula{background:var(--soft);border-left:4px solid var(--accent);padding:12px 14px;border-radius:6px;font-weight:600}
.notes label{display:block;font-weight:600;margin:12px 0 4px;font-size:15px}.notes textarea{width:100%;min-height:64px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.btn{border:1px solid var(--accent);background:var(--card);color:var(--accent);border-radius:99px;padding:8px 16px;font-weight:600}.btn.pri{background:var(--accent);color:var(--accent-ink)}
.saved{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:15px}th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}th{background:var(--soft)}
.weekpick{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}.weekpick a{padding:5px 12px;border:1px solid var(--line);border-radius:99px;text-decoration:none;font-size:14px;color:var(--ink)}.weekpick a.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

</style></head><body>
<div class="top"><div class="w"><div class="brand">Carbon Clarity Learning<small>Learn something every day. Explain everything with confidence.</small></div>
<div class="prog"><span id="progtxt">0 of 20 lessons done</span><div class="bar"><i id="progbar"></i></div></div>
<button class="today" id="todayBtn">Today's lesson</button></div></div>
<div class="layout"><aside id="nav"></aside><main id="view"></main></div>
<script>
var D={"how": "<p>You learn one thing every day for 45 minutes. After 4 weeks you will\nhave covered every area of Carbon Clarity once. Then start again from\nWeek 1 and go deeper. Each day's section in your calendar matches a\nsection below.<\/p>\n<p><strong>The daily routine (7:00–7:45)<\/strong><\/p>\n<ol type=\"1\">\n<li><strong>Read (20 min).<\/strong> Open the reading for today's day and\nweek. Skim the headings first, then read slowly.<\/li>\n<li><strong>Understand (15 min).<\/strong> Read the key ideas in this\nguide. Answer the two questions in your own words, on paper.<\/li>\n<li><strong>Write your 3 sentences (10 min).<\/strong> Add one row to the\nnotes log at the end of this guide:\n<ul>\n<li>Today I learned…<\/li>\n<li>It matters for Carbon Clarity because…<\/li>\n<li>I could explain it to a fisher, a funder or a professor as…<\/li>\n<\/ul><\/li>\n<\/ol>\n<p><strong>The weekly rhythm<\/strong><\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr class=\"header\">\n<th>Day<\/th>\n<th>Focus<\/th>\n<th>Why it matters<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Monday<\/td>\n<td>Carbon markets &amp; MRV<\/td>\n<td>How smoke saved becomes money for women processors (Phase 3)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Tuesday<\/td>\n<td>Research methods &amp; data<\/td>\n<td>Makes the paper and pilot results credible (Phase 1)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Wednesday<\/td>\n<td>Stove technology &amp; measurement<\/td>\n<td>Lets you judge stoves and sensors (Phase 1–2)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Thursday<\/td>\n<td>Funding &amp; running the venture<\/td>\n<td>Keeps the project alive and growing<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Friday<\/td>\n<td>Carbon markets &amp; policy<\/td>\n<td>Helps you avoid the mistakes others made, and follow Ghana's\nrules<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Saturday<\/td>\n<td>Explain it out loud<\/td>\n<td>Turns reading into confidence<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Sunday<\/td>\n<td>Leadership &amp; reflection (light)<\/td>\n<td>Rest, and choose next week's focus<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>If you miss a day, don't try to catch up twice. Just do the next\nday's session. Consistency matters more than catching up.<\/p>\n", "mon": {"title": "Monday: Carbon markets & MRV", "goal": "<p>Goal: by Week 4 you can explain step by step how wood saved in a\nJames Town smoker becomes a carbon credit and a mobile-money payment.\nMRV means Measurement, Reporting and Verification. It is the evidence\nbuyers pay for.<\/p>\n", "weeks": [{"title": "Week 1: What a carbon credit is", "html": "<p><strong>Read:<\/strong> <a\nhref=\"https://interactive.carbonbrief.org/carbon-offsets-2023/\">Carbon\nBrief Q&amp;A on carbon offsets<\/a>, the sections on what offsets are\nand on cookstoves.<\/p>\n<p><strong>Key ideas<\/strong><\/p>\n<ul>\n<li>One credit = one tonne of CO₂ kept out of the air (tCO₂e).<\/li>\n<li>A stove project earns credits for the wood it saves compared with\nthe old kiln (the <strong>baseline<\/strong>).<\/li>\n<li>Only wood taken from forests faster than they regrow counts. That\nshare is <strong>fNRB<\/strong> (fraction of non-renewable biomass).<\/li>\n<li>The core calculation:<\/li>\n<\/ul>\n<p class=\"formula\">Emission reductions = wood saved (t) × f<sub>NRB<\/sub> × energy per tonne × CO₂ per unit of energy<\/p>\n\n<p><strong>Answer in your own words:<\/strong> Why does fNRB matter so\nmuch? What baseline would we use for Chorkor kilns?<\/p>\n"}, {"title": "Week 2: Gold Standard metered & measured method", "html": "<p><strong>Read:<\/strong> <a\nhref=\"https://globalgoals.goldstandard.org/430_ee_ics_methodology-for-metered-measured-energy-cooking-devices/\">Gold\nStandard Methodology for Metered &amp; Measured Energy Cooking Devices\n(MECD)<\/a>, the summary page and the first pages of the PDF.<\/p>\n<p><strong>Key ideas<\/strong><\/p>\n<ul>\n<li>Credits are based on energy <strong>measured<\/strong> at the device\n(meters, sensors), not on surveys or estimates.<\/li>\n<li>This is why our IoT sensors and the Data Vault matter: they could\nmake Carbon Clarity credits measured, not guessed.<\/li>\n<li>It was written mainly for electric and gas stoves. Ask how far it\ncould fit biomass fish smokers.<\/li>\n<\/ul>\n<p><strong>Answer:<\/strong> What would we need to measure on each smoker\nevery day? Who checks the data?<\/p>\n"}, {"title": "Week 3: Verra VM0050", "html": "<p><strong>Read:<\/strong> <a\nhref=\"https://verra.org/methodologies/vm0050-energy-efficiency-and-fuel-switch-measures-in-cookstoves-v1-0/\">Verra\nVM0050, Energy Efficiency and Fuel Switch Measures in Cookstoves<\/a>,\nthe overview.<\/p>\n<p><strong>Key ideas<\/strong><\/p>\n<ul>\n<li>Verra's newer cookstove method, made stricter after over-crediting\ncriticism.<\/li>\n<li>It uses more conservative fNRB values and requires checking that\nstoves are actually used.<\/li>\n<li>Compare it with Gold Standard: who measures, how often, and how\nconservative.<\/li>\n<\/ul>\n<p><strong>Answer:<\/strong> Name two ways VM0050 is stricter than older\nmethods.<\/p>\n"}, {"title": "Week 4: CLEAR, the newest approach", "html": "<p><strong>Read:<\/strong> <a\nhref=\"https://cleancooking.org/4c/methodology\">CLEAR Methodology, Clean\nCooking Alliance<\/a>. For background, read the <a\nhref=\"https://mecs.org.uk/blog/why-metered-carbon-credits-matter-for-clean-cooking-and-how-the-debate-is-moving-on/\">MECS\nblog on metered credits<\/a>.<\/p>\n<p><strong>Key ideas<\/strong><\/p>\n<ul>\n<li>CLEAR was built to fix the over-crediting problems in older\ncookstove methods.<\/li>\n<li>It relies on measured fuel use and on conservative, up-to-date\ndefaults.<\/li>\n<li>High-integrity credits sell for more. Integrity is a selling point\nfor Carbon Clarity, not a cost.<\/li>\n<\/ul>\n<p><strong>Answer:<\/strong> If a buyer asked \"How do I know your credits\nare real?\", what would you say in 3 sentences?<\/p>\n"}]}, "tue": {"title": "Tuesday: Research methods & data", "goal": "<p>Goal: you can defend every number in the working paper and the pilot,\nand answer \"How do you know?\" from any professor.<\/p>\n", "weeks": [{"title": "Week 1: Designing a good survey", "html": "<p><strong>Read:<\/strong> <a\nhref=\"https://www.pewresearch.org/writing-survey-questions/\">Pew\nResearch Center, Writing Survey Questions<\/a>.<\/p>\n<p><strong>Key ideas<\/strong><\/p>\n<ul>\n<li>Ask one thing per question. Avoid leading words (\"Don't you agree\nthe new stove is better?\").<\/li>\n<li>Pilot the questionnaire with 3–5 processors before the real survey,\nin Ga or Twi.<\/li>\n<li>Record fuel use, cost, smoke exposure and income the same way at\nbaseline and after the pilot. Otherwise you can't compare.<\/li>\n<\/ul>\n<p><strong>Answer:<\/strong> Rewrite one question from our baseline\nsurvey so it is clearer and not leading.<\/p>\n"}, {"title": "Week 2: Thematic analysis of interviews", "html": "<p><strong>Read:<\/strong> <a\nhref=\"https://doi.org/10.1191/1478088706qp063oa\">Braun &amp; Clarke\n(2006), Using thematic analysis in psychology<\/a>, the six phases.<\/p>\n<p><strong>Key ideas<\/strong><\/p>\n<ul>\n<li>Six phases: get familiar, code, find themes, review themes, name\nthem, write up.<\/li>\n<li>A theme is a pattern across many interviews, not one quote you\nlike.<\/li>\n<li>Keep an audit trail (codebook, dates, who coded) so a reviewer can\ntrust the analysis.<\/li>\n<\/ul>\n<p><strong>Answer:<\/strong> What themes do you expect from the James\nTown interviews? How will you check you are not just confirming what you\nexpect?<\/p>\n"}, {"title": "Week 3: Basic statistics in R", "html": "<p><strong>Read:<\/strong> <a target=\"_blank\" rel=\"noopener\" href=\"https://r4ds.hadley.nz/\">R for Data\nScience (2nd ed.)<\/a>, chapters \"Whole game\" and \"Data visualization\".\nInstall R and RStudio first (free).<\/p>\n<p><strong>Key ideas<\/strong><\/p>\n<ul>\n<li>Mean and median describe the middle. Standard deviation describes\nthe spread.<\/li>\n<li>A paired t-test compares the same processors before and after, for\nexample kg of wood per batch on the Chorkor versus the Ahotor.<\/li>\n<li>With a small pilot, report the size of the difference with a\nconfidence interval, not just \"significant\".<\/li>\n<\/ul>\n<p><strong>Answer:<\/strong> If 10 processors used 20% less wood, what\nelse would you need to know before claiming the stove works?<\/p>\n"}, {"title": "Week 4: Writing for peer review", "html": "<p><strong>Read:<\/strong> <a\nhref=\"https://doi.org/10.1371/journal.pcbi.1005619\">Mensh &amp; Kording\n(2017), Ten simple rules for structuring papers<\/a>.<\/p>\n<p><strong>Key ideas<\/strong><\/p>\n<ul>\n<li>One central message per paper. Every section serves it.<\/li>\n<li>Each paragraph starts with its point. Each figure tells one\nstory.<\/li>\n<li>Reviewers look first at the title, abstract and figures. Make them\nstrong.<\/li>\n<\/ul>\n<p><strong>Answer:<\/strong> Write the central message of the working\npaper in one sentence of under 25 words.<\/p>\n"}]}, "wed": {"title": "Wednesday: Stove technology & measurement", "goal": "<p>Goal: you can explain why the Ahotor produces less smoke than the\nChorkor, and how we will prove it with numbers.<\/p>\n", "weeks": [{"title": "Week 1: How fire and smoke work", "html": "<p><strong>Read:<\/strong> <a\nhref=\"https://files.peacecorps.gov/documents/M0091_ANNEX_Cookstoves_TP_ICS_1_Improved-Cookstoves-Handbook.pdf\">Peace\nCorps Improved Cookstoves Handbook<\/a>, the chapter on combustion and\nstove design principles.<\/p>\n<p><strong>Key ideas<\/strong><\/p>\n<ul>\n<li>Clean burning needs three things: enough heat, enough air, and\nenough time for gases to burn (the \"three Ts\": temperature, turbulence,\ntime).<\/li>\n<li>Smoke is unburnt fuel. Less smoke usually means less wood\nwasted.<\/li>\n<li>In fish smoking, <strong>fat dripping onto the fire<\/strong> makes\nthe most harmful smoke (PAHs, cancer-causing compounds). The Ahotor and\nFAO-Thiaroye (FTT) designs separate the fire from the dripping fat.<\/li>\n<\/ul>\n<p><strong>Answer:<\/strong> Draw the Chorkor and the Ahotor from the\nside. Mark where the fire, the fish and the dripping fat are.<\/p>\n"}, {"title": "Week 2: Testing stoves to a standard", "html": "<p><strong>Read:<\/strong> the <a\nhref=\"https://www.iso.org/standard/66519.html\">ISO 19867-1:2018 summary\npage<\/a>, then reread your copy of L.I. 2454.<\/p>\n<p><strong>Key ideas<\/strong><\/p>\n<ul>\n<li>ISO 19867-1 is the international lab test for cookstoves:\nefficiency, emissions, safety and durability, scored in tiers.<\/li>\n<li>Ghana's L.I. 2454 uses it: a safety score of at least 85, efficiency\nof at least 25% for wood and above 35% for charcoal, plus\nlabelling.<\/li>\n<li>Lab results are often better than real use. That's why we also\nmeasure in the field at James Town.<\/li>\n<\/ul>\n<p><strong>Answer:<\/strong> Does L.I. 2454 clearly cover commercial fish\nsmokers? What would you ask the Energy Commission?<\/p>\n"}, {"title": "Week 3: Measuring smoke exposure", "html": "<p><strong>Read:<\/strong> <a\nhref=\"https://doi.org/10.1289/EHP9873\">Weyant et al. (2022),\nEnvironmental Health Perspectives<\/a>, on PM₂.₅ and CO exposure.<\/p>\n<p><strong>Key ideas<\/strong><\/p>\n<ul>\n<li>PM₂.₅ = tiny particles that go deep into the lungs. CO = carbon\nmonoxide, a poisonous gas.<\/li>\n<li>Personal monitors worn by the processor show what she actually\nbreathes, not just what the kiln gives off.<\/li>\n<li>Measure the same women before and after the switch, at the same\ntasks, for 24–48 hours.<\/li>\n<\/ul>\n<p><strong>Answer:<\/strong> Why is a personal monitor better evidence\nthan one sensor on the kiln?<\/p>\n"}, {"title": "Week 4: Sensors, IoT and audit-ready data", "html": "<p><strong>Read:<\/strong> reread the Gold Standard MECD page from Monday\nWeek 2, then open the Data Vault app and list every field it\nrecords.<\/p>\n<p><strong>Key ideas<\/strong><\/p>\n<ul>\n<li>Sensors can record temperature, run time and fuel weight\nautomatically, with a timestamp.<\/li>\n<li>\"Audit-ready\" means: raw data kept, each device has an ID, changes\nlogged, and calibration recorded.<\/li>\n<li>Good data serves three needs at once: the paper (Phase 1), the stove\ndesign (Phase 2) and carbon credits (Phase 3).<\/li>\n<\/ul>\n<p><strong>Answer:<\/strong> What three things must the Data Vault record\nfor a verifier to trust it?<\/p>\n"}]}, "thu": {"title": "Thursday: Funding & running the venture", "goal": "<p>Goal: you can ask for money with confidence and show exactly how it\nwill be used and repaid in impact.<\/p>\n", "weeks": [{"title": "Week 1: Writing a winning grant", "html": "<p><strong>Read:<\/strong> <a\nhref=\"https://doi.org/10.1371/journal.pcbi.0020012\">Bourne &amp; Chalupa\n(2006), Ten simple rules for getting grants<\/a>.<\/p>\n<p><strong>Key ideas<\/strong><\/p>\n<ul>\n<li>Read the funder's goals first. Write to their goals using your\nevidence.<\/li>\n<li>Structure: problem → what you will do → why you → budget →\nmeasurable results.<\/li>\n<li>Ask a colleague to read it as a reviewer before you submit.<\/li>\n<\/ul>\n<p><strong>Answer:<\/strong> Write a 3-sentence problem statement for\nCarbon Clarity that a funder would remember.<\/p>\n"}, {"title": "Week 2: A simple financial model", "html": "<p><strong>Read:<\/strong> browse the free courses at <a\nhref=\"https://acumenacademy.org\">Acumen Academy<\/a> on social enterprise\nfinance and business models.<\/p>\n<p><strong>Key ideas<\/strong><\/p>\n<ul>\n<li>Know three numbers: cost per stove installed, cost per processor per\nyear to run MRV, and expected credits per stove per year.<\/li>\n<li>Revenue per stove = credits × price per credit. Then subtract\nverification costs and the processors' benefit share.<\/li>\n<li>Test a low, middle and high carbon price. Never plan only for the\nbest price.<\/li>\n<\/ul>\n<p><strong>Answer:<\/strong> List the costs of the comparative pilot.\nWhich one is most uncertain?<\/p>\n"}, {"title": "Week 3: Pitching", "html": "<p><strong>Read:<\/strong> <a\nhref=\"https://www.ycombinator.com/library\">Y Combinator Startup\nLibrary<\/a>, search \"how to pitch\".<\/p>\n<p><strong>Key ideas<\/strong><\/p>\n<ul>\n<li>Within 30 seconds say: the problem, who has it, your solution, and\nthe proof so far.<\/li>\n<li>Use one striking number (for example, hours of smoke exposure per\nday).<\/li>\n<li>End with a clear ask: money, a partner or an introduction.<\/li>\n<\/ul>\n<p><strong>Answer:<\/strong> Write and time a 60-second pitch. Record it\non Saturday.<\/p>\n"}, {"title": "Week 4: Partnerships & agreements", "html": "<p><strong>Read:<\/strong> reread any agreement or MoU you have\n(CSIR-FRI, Ashesi, the processors' association), with this checklist in\nmind.<\/p>\n<p><strong>Key ideas<\/strong><\/p>\n<ul>\n<li>Every agreement should say: who does what, who owns the data, who\nowns the carbon credits, and how money is shared.<\/li>\n<li><strong>Benefit-sharing<\/strong> by mobile money must be written\ndown before credits are sold, and agreed with the women themselves.<\/li>\n<li>Get legal advice before signing anything about carbon rights.<\/li>\n<\/ul>\n<p><strong>Answer:<\/strong> Who should own the carbon credits from a\nstove: the processor, Carbon Clarity or the funder? Why?<\/p>\n"}]}, "fri": {"title": "Friday: Carbon markets & policy", "goal": "<p>Goal: you can answer tough critics of cookstove credits, and explain\nhow Ghana's rules shape Carbon Clarity.<\/p>\n", "weeks": [{"title": "Week 1: What makes a credit high quality", "html": "<p><strong>Read:<\/strong> <a\nhref=\"https://icvcm.org/core-carbon-principles/\">ICVCM Core Carbon\nPrinciples<\/a>.<\/p>\n<p><strong>Key ideas<\/strong><\/p>\n<ul>\n<li>The ten principles include: <strong>additionality<\/strong> (it would\nnot happen without carbon money), <strong>permanence<\/strong>,\n<strong>robust quantification<\/strong> (no over-counting), <strong>no\ndouble counting<\/strong>, and <strong>sustainable development\nbenefits<\/strong>.<\/li>\n<li>Credits that pass get a \"CCP\" label and usually sell for a higher\nprice.<\/li>\n<\/ul>\n<p><strong>Answer:<\/strong> Is our stove project additional? Argue both\nsides in two sentences each.<\/p>\n"}, {"title": "Week 2: The over-crediting critique", "html": "<p><strong>Read:<\/strong> <a\nhref=\"https://doi.org/10.1038/s41893-023-01259-6\">Gill-Wiehl, Kammen\n&amp; Haya (2024), Nature Sustainability<\/a>, the abstract and figures.\nA plain summary is on <a\nhref=\"https://phys.org/news/2024-01-global-carbon-overcredit-cookstove-greenhouse.html\">Phys.org<\/a>.<\/p>\n<p><strong>Key ideas<\/strong><\/p>\n<ul>\n<li>The study found cookstove projects claimed about 9 times more\nreductions than they really achieved.<\/li>\n<li>Main causes: fNRB set too high, stove use overestimated, and old\nstoves still used alongside new ones (<strong>stacking<\/strong>).<\/li>\n<li>Our answer: measure actual fuel use, use conservative fNRB, and\ncheck whether the Chorkor is still used.<\/li>\n<\/ul>\n<p><strong>Answer:<\/strong> A professor says \"cookstove credits are a\nscam\". Write your 3-sentence reply.<\/p>\n"}, {"title": "Week 3: Article 6 and Ghana's carbon market", "html": "<p><strong>Read:<\/strong> <a\nhref=\"https://klik.ch/news/news-article/first-itmo-transfer-switzerland-ghana\">KliK\nFoundation, first ITMO transfer Switzerland–Ghana<\/a>, and <a\nhref=\"https://gna.org.gh/2025/03/ghanas-carbon-market-to-generate-over-1-billion-by-2030/\">GNA,\nGhana's carbon market to generate over $1 billion by 2030<\/a>.<\/p>\n<p><strong>Key ideas<\/strong><\/p>\n<ul>\n<li>Article 6 of the Paris Agreement lets countries trade emission\nreductions (ITMOs).<\/li>\n<li>Ghana was among the first to transfer Article 6 credits, from a\ncookstove project, to Switzerland.<\/li>\n<li>Ghana requires carbon projects to be authorised and registered\nnationally, and the government takes a share. Find out what applies to\nus.<\/li>\n<\/ul>\n<p><strong>Answer:<\/strong> What is a \"corresponding adjustment\", and\nwhy does Ghana care about it?<\/p>\n"}, {"title": "Week 4: Ghana's clean cooking policy & L.I. 2454", "html": "<p><strong>Read:<\/strong> your copy of L.I. 2454 and the policy section\n(2.5) of the working paper.<\/p>\n<p><strong>Key ideas<\/strong><\/p>\n<ul>\n<li>L.I. 2454 sets minimum stove performance and labels so that\npoor-quality stoves are kept off the market.<\/li>\n<li>Show that the stove we pilot meets it, or explain clearly why fish\nsmokers need their own standard.<\/li>\n<li>Policy is an opportunity: our data could help the Energy Commission\nset a standard for fish smokers.<\/li>\n<\/ul>\n<p><strong>Answer:<\/strong> In 3 sentences, explain to a policymaker why\nfish smokers need attention in clean cooking policy.<\/p>\n"}]}, "sat": {"title": "Saturday practice: explain it out loud (9:00–10:00)", "html": "<p>This is the session that builds confidence. You don't learn anything\nnew. You prove to yourself that you can explain what you learned.<\/p>\n<ol type=\"1\">\n<li><strong>Re-read (10 min).<\/strong> Read this week's five notes in\nthe log below.<\/li>\n<li><strong>Pick the hardest topic (5 min).<\/strong> Choose the one you\nfeel least sure about.<\/li>\n<li><strong>Explain it in 2 minutes, without notes (15 min).<\/strong>\nRecord it on your phone. Listen back. Do it again, better.<\/li>\n<li><strong>Write one plain paragraph (10 min)<\/strong> that a fish\nprocessor in James Town would understand. No jargon.<\/li>\n<li><strong>Answer 3 hard questions (20 min)<\/strong> from the bank\nbelow, out loud, as if a provost or funder asked you.<\/li>\n<\/ol>\n<p>Once a month, explain one topic to your co-author or an intern and\nask them to challenge you.<\/p>\n<p><strong>Hard questions bank<\/strong><\/p>\n<ul>\n<li>How do you know the new stove actually saves wood, and isn't just\nused on good days?<\/li>\n<li>Cookstove credits have been over-credited by about 9 times. Why\nshould anyone trust yours?<\/li>\n<li>Who owns the carbon credits, and how much reaches the women?<\/li>\n<li>Does the Ahotor meet L.I. 2454? If not, why pilot it?<\/li>\n<li>What happens if processors go back to the Chorkor after the study\nends?<\/li>\n<li>Your sample is small. Why should we believe your results?<\/li>\n<li>What does your fNRB value come from?<\/li>\n<li>How is your stove design different from the Ahotor and the FTT?<\/li>\n<li>What does it cost per tonne of CO₂ reduced?<\/li>\n<li>How will the sensor data stay secure and honest?<\/li>\n<li>Why are you the right team to do this?<\/li>\n<li>What's the single most important finding of your baseline\nstudy?<\/li>\n<\/ul>\n"}, "sun": {"title": "Sunday: Leadership & reflection (17:00–17:30, light)", "html": "<p>Sunday is your rest day, so keep this gentle: 15 minutes of reading\nand 15 minutes of reflection. Read one chapter at a time, in this\norder:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr class=\"header\">\n<th>Order<\/th>\n<th>Book<\/th>\n<th>Why read it<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>1<\/td>\n<td><em>The Blue Sweater<\/em>, Jacqueline Novogratz<\/td>\n<td>A founder learning to build impact businesses in Africa<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>2<\/td>\n<td><em>Poor Economics<\/em>, Banerjee &amp; Duflo<\/td>\n<td>Why people adopt, or don't adopt, new technology like stoves<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>3<\/td>\n<td><em>Start with Why<\/em>, Simon Sinek<\/td>\n<td>Explaining your purpose so others want to join<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>4<\/td>\n<td><em>Manifesto for a Moral Revolution<\/em>, Jacqueline Novogratz<\/td>\n<td>Leading with humility and accountability<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Reflection (write 3 short answers)<\/strong><\/p>\n<ul>\n<li>What went well this week, and what am I grateful for?<\/li>\n<li>What was hardest, and what did I learn from it?<\/li>\n<li>What is the one thing I most want to understand better next\nweek?<\/li>\n<\/ul>\n"}, "gloss": "<div class=\"tw\"><table>\n<thead>\n<tr class=\"header\">\n<th>Term<\/th>\n<th>Plain meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Additionality<\/td>\n<td>The reductions would not happen without carbon money<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Article 6<\/td>\n<td>Part of the Paris Agreement that lets countries trade emission\nreductions<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Baseline<\/td>\n<td>What would happen without the project, e.g. the Chorkor kiln<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>CCP<\/td>\n<td>Core Carbon Principles, the ICVCM quality label for credits<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>CO<\/td>\n<td>Carbon monoxide, a poisonous gas from incomplete burning<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Corresponding adjustment<\/td>\n<td>The selling country removes the credits from its own climate target\nso they aren't counted twice<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>fNRB<\/td>\n<td>Share of wood taken faster than forests regrow; only this share\nearns credits<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>ISO 19867-1<\/td>\n<td>International lab test for cookstove performance<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>ITMO<\/td>\n<td>Internationally Transferred Mitigation Outcome, a credit traded\nunder Article 6<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>L.I. 2454<\/td>\n<td>Ghana's legal standard and labelling rules for cookstoves<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>MRV<\/td>\n<td>Measurement, Reporting and Verification<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>PAHs<\/td>\n<td>Cancer-causing compounds formed when fat burns in smoke<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>PM₂.₅<\/td>\n<td>Tiny smoke particles that go deep into the lungs<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Stacking<\/td>\n<td>Using the old and new stoves side by side<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>tCO₂e<\/td>\n<td>One tonne of CO₂ or its equivalent: one carbon credit<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Verification<\/td>\n<td>An independent auditor checks the data before credits are\nissued<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n", "sources": "<ul>\n<li><a\nhref=\"https://interactive.carbonbrief.org/carbon-offsets-2023/\">Carbon\nBrief, Q&amp;A on carbon offsets<\/a><\/li>\n<li><a\nhref=\"https://globalgoals.goldstandard.org/430_ee_ics_methodology-for-metered-measured-energy-cooking-devices/\">Gold\nStandard, MECD methodology<\/a><\/li>\n<li><a\nhref=\"https://verra.org/methodologies/vm0050-energy-efficiency-and-fuel-switch-measures-in-cookstoves-v1-0/\">Verra,\nVM0050<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://cleancooking.org/4c/methodology\">Clean Cooking\nAlliance, CLEAR Methodology<\/a><\/li>\n<li><a\nhref=\"https://mecs.org.uk/blog/why-metered-carbon-credits-matter-for-clean-cooking-and-how-the-debate-is-moving-on/\">MECS,\nwhy metered carbon credits matter<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.pewresearch.org/writing-survey-questions/\">Pew\nResearch Center, Writing Survey Questions<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://doi.org/10.1191/1478088706qp063oa\">Braun &amp;\nClarke (2006)<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://r4ds.hadley.nz/\">R for Data Science<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://doi.org/10.1371/journal.pcbi.1005619\">Mensh &amp;\nKording (2017)<\/a><\/li>\n<li><a\nhref=\"https://files.peacecorps.gov/documents/M0091_ANNEX_Cookstoves_TP_ICS_1_Improved-Cookstoves-Handbook.pdf\">Peace\nCorps Improved Cookstoves Handbook<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.iso.org/standard/66519.html\">ISO\n19867-1:2018<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://doi.org/10.1289/EHP9873\">Weyant et al.\n(2022)<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://doi.org/10.1371/journal.pcbi.0020012\">Bourne &amp;\nChalupa (2006)<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://acumenacademy.org\">Acumen Academy<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.ycombinator.com/library\">Y Combinator Startup\nLibrary<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://icvcm.org/core-carbon-principles/\">ICVCM Core\nCarbon Principles<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://doi.org/10.1038/s41893-023-01259-6\">Gill-Wiehl,\nKammen &amp; Haya (2024)<\/a><\/li>\n<li><a\nhref=\"https://klik.ch/news/news-article/first-itmo-transfer-switzerland-ghana\">KliK\nFoundation, first ITMO transfer Switzerland–Ghana<\/a><\/li>\n<li><a\nhref=\"https://gna.org.gh/2025/03/ghanas-carbon-market-to-generate-over-1-billion-by-2030/\">GNA,\nGhana's carbon market by 2030<\/a><\/li>\n<\/ul>\n", "videos": {"mon-1": [["91Ss1ZhS7zE", "Carbon Credits Explained: What They Are, and What They Aren't"], ["Aw9ZfE4GLXI", "Carbon credits help expand Kenyan cookstove company"]], "mon-2": [["BNDVS--kkJU", "Navigating the complexities of carbon finance in clean cooking"], ["HZBblsV3l6Y", "What is MRV? (Measurement, Reporting and Verification)"]], "mon-3": [["HzAtDwv7LhU", "Verra & DelAgua: Transforming lives through clean cooking"], ["CVKooh0Ou7o", "What are carbon standards? (Verra, Gold Standard and others)"]], "mon-4": [["op32b803ZHw", "Launching the Buyer's Guide to High-Quality Cookstove Carbon Credits"], ["Mf2RsdTe96Q", "Clean cooking: financing, policy and innovation for last-mile impact"]], "tue-1": [["_zoIVE9PRTM", "How to design a questionnaire or survey"], ["LnbJUA67W80", "How to ask good survey questions"]], "tue-2": [["wK04kTxc5tg", "Thematic analysis explained: the 6 steps by Braun & Clarke (2006)"], ["5zFcC10vOVY", "Thematic analysis: an introduction"]], "tue-3": [["FIrsOBy5k58", "RStudio for the total beginner"], ["Jvw794R23lQ", "R tutorial: paired samples t-test"]], "tue-4": [[" var g=document.getElementById("gdocBtn");g.onclick=function(){var L=["Today I learned: ","It matters for Carbon Clarity because: ","I could explain it as: "];var txt=new Date().toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"})+" · "+name(id)+"\n"+[0,1,2].map(function(i){return L[i]+(document.getElementById("n"+i).value.trim()||"—")}).join("\n")+"\n";var w=window.open("https://docs.google.com/document/d/1vxnDlsg9PAJlUZEmL7xdZ3aes5q9xmBcQpJiPLOS2Sc/edit","_blank");try{navigator.clipboard.writeText(txt).then(function(){document.getElementById("saved").textContent="Copied. Paste it at the bottom of the Google Doc."},function(){document.getElementById("saved").textContent="Couldn't copy automatically. Select your sentences and copy them."})}catch(e){}};var b=document.getElementById("doneBtn");function lab(){b.textContent=done(id)?"✓ Completed (tap to undo)":"Mark lesson complete";b.className=done(id)?"btn":"btn pri"}lab();b.onclick=function(){ls("cc_done_"+id,done(id)?"0":"1");lab();progress();nav(id)}}
function lesson(id){var p=id.split("-"),d=D[p[0]],w=+p[1],di=DAYS.findIndex(function(x){return x[0]===p[0]});var wk=d.weeks[w-1];
var h='<div class="card"><p class="crumb">'+DAYS[di][1]+' · Week '+w+' of 4</p><h1>'+esc(wk.title.replace(/^Week \d: /,""))+'</h1>'+d.goal+'<div class="weekpick">'+[1,2,3,4].map(function(n){return '<a href="#'+p[0]+"-"+n+'" class="'+(n===w?"on":"")+'">Week '+n+(done(p[0]+"-"+n)?" ✓":"")+"</a>"}).join("")+"</div></div>";
h+=videoBlock(D.videos[id])+'<div class="card"><h2>Read & understand</h2>'+wk.html+"</div>"+notesBlock(id);
var nx=w<4?p[0]+"-"+(w+1):(DAYS[di+1]?DAYS[di+1][0]+"-1":"sat");h+='<div class="row" style="justify-content:flex-end"><a class="btn" href="#'+nx+'">Next lesson →</a></div>';
render(h,id);player(D.videos[id],document.querySelector(".card:nth-of-type(2)"));wireNotes(id)}
function render(h,cur){document.getElementById("view").innerHTML=h;nav(cur);window.scrollTo(0,0)}
function home(){var t=todayId(),lbl=t==="sat"?"Saturday practice":t==="sun"?"Sunday reflection":(function(){var p=t.split("-");return DAYS.find(function(x){return x[0]===p[0]})[1]+", Week "+p[1]+": "+D[p[0]].weeks[p[1]-1].title.replace(/^Week \d: /,"")})();
var h='<div class="card"><h1>Welcome back</h1><p>Today: <strong>'+esc(lbl)+'</strong></p><div class="row"><a class="btn pri" href="#'+t+'">Start today\'s lesson</a><a class="btn" href="#notes">My notes</a></div></div>';
h+=videoBlock(D.videos.start,"Start here: why clean cooking matters")+'<div class="card"><h2>How this works</h2>'+D.how.replace("Add one row to the notes log at the end of this guide","Type them in the notes box under each lesson")+"</div>";
render(h,"home");player(D.videos.start,document.querySelector(".card:nth-of-type(2)"))}
function weekend(k){var d=D[k];var h='<div class="card"><h1>'+esc(d.title)+"</h1></div>";if(k==="sun"&&D.videos.sun)h+=videoBlock(D.videos.sun,"Watch (optional)");h+='<div class="card">'+d.html+"</div>"+notesBlock(k+"-"+isoWeek());render(h,k);if(k==="sun")player(D.videos.sun,document.querySelector(".card:nth-of-type(2)"));wireNotes(k+"-"+isoWeek())}
function isoWeek(){var d=new Date();d.setHours(0,0,0,0);return d.getFullYear()+"w"+Math.floor((d-new Date(d.getFullYear(),0,1))/6048e5)}
function library(){var h='<div class="card"><h1>Video library</h1><p class="hint">Every video in the programme, by topic. Tap one to go to its lesson.</p></div>';
DAYS.forEach(function(d){h+='<div class="card"><h2>'+d[1]+" · "+d[2]+'</h2><div class="more">';for(var w=1;w<=4;w++)D.videos[d[0]+"-"+w].forEach(function(v){h+='<a class="vt" style="text-decoration:none" href="#'+d[0]+"-"+w+'"><img alt="" loading="lazy" src="https://i.ytimg.com/vi/'+v[0]+'/mqdefault.jpg"><span>Week '+w+" · "+esc(v[1])+"</span></a>"});h+="</div></div>"});render(h,"videos")}
function notes(){var items=[];Object.keys(localStorage||{}).forEach(function(k){var m=k.match(/^cc_note_(.+)_(\d)$/);if(m&&ls(k))items.push([m[1],+m[2],ls(k)])});
var by={};items.forEach(function(x){(by[x[0]]=by[x[0]]||[])[x[1]]=x[2]});var keys=Object.keys(by).sort();
var lbls=["Today I learned","Why it matters","How I'd explain it"];
var h='<div class="card"><h1>My notes</h1><p class="hint">Your notes stay in this browser on this device. Download them regularly as a backup, or paste them into the Learning Guide doc.</p><div class="row"><button class="btn pri" id="dl">Download my notes (.txt)</button></div></div><div class="card">';
h+=keys.length?keys.map(function(k){return '<div class="note-item"><a href="#'+k+'"><strong>'+esc(name(k))+"</strong></a>"+by[k].map(function(t,i){return t?"<p><em>"+lbls[i]+":</em> "+esc(t)+"</p>":""}).join("")+"</div>"}).join(""):"<p>No notes yet. Write your three sentences at the end of each lesson.</p>";
render(h+"</div>","notes");document.getElementById("dl").onclick=function(){var txt=keys.map(function(k){return name(k)+"\n"+by[k].map(function(t,i){return t?lbls[i]+": "+t:""}).filter(Boolean).join("\n")}).join("\n\n");var b=new Blob([txt||"No notes yet."],{type:"text/plain"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="carbon-clarity-learning-notes.txt";document.body.appendChild(a);a.click();a.remove()}}
function name(k){var p=k.split("-");var d=DAYS.find(function(x){return x[0]===p[0]});if(d)return d[1]+" Week "+p[1]+": "+D[p[0]].weeks[p[1]-1].title.replace(/^Week \d: /,"");return(p[0]==="sat"?"Saturday practice ":"Sunday reflection ")+(p[1]||"")}
function route(){var id=(location.hash||"#home").slice(1);if(/^(mon|tue|wed|thu|fri)-[1-4]$/.test(id))lesson(id);else if(id==="sat"||id==="sun")weekend(id);else if(id==="videos")library();
else if(id==="readings")render('<div class="card"><h1>Readings</h1><p class="hint">Every reading in the programme. All open in a new tab.</p>'+D.sources+"</div>","readings");
else if(id==="glossary")render('<div class="card"><h1>Glossary</h1><div class="tw">'+D.gloss+"</div></div>","glossary");else if(id==="notes")notes();else home();progress()}
document.getElementById("todayBtn").onclick=function(){location.hash=todayId()};window.onhashchange=route;route();
</script></body></html>
